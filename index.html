U({branch:'Aerodinámica y electrónica',title:'Aerodinámica',sub:'Resistencia, carga aerodinámica, efecto suelo y aire sucio.',icon:'wing'},[
L('Cómo se comporta el aire',
`<p>A velocidad el aire deja de ser invisible: ejerce fuerzas enormes. Todo parte de la <b>presión dinámica</b>.</p>
<span class="k">q = ½ · ρ · v² &nbsp;&nbsp; (Pa)<br>ρ del aire ≈ 1,225 kg/m³ (nivel del mar, 15 °C)</span>
<ul><li><b>Bernoulli</b>: donde el aire acelera, la presión estática baja.</li><li><b>Capa límite</b>: fina capa de aire pegada a la superficie. Si se separa del cuerpo, aparece estela y resistencia.</li><li>La densidad cae con la altura y el calor: un circuito en altura tiene menos carga y menos resistencia.</li></ul>
<p>Como q depende de <b>v²</b>, al duplicar la velocidad las fuerzas aerodinámicas se multiplican por <b>cuatro</b>.</p>`,
[
 num('¿Cuál es la presión dinámica a 100 m/s con ρ = 1,225 kg/m³?',6125,'Pa',20,'q = 0,5 × 1,225 × 100² = 6.125 Pa.'),
 mc('Si la velocidad se duplica, la presión dinámica…',['se duplica','se cuadruplica','se triplica','queda igual'],1,'q ∝ v².'),
 mc('Según Bernoulli, donde el aire se acelera…',['la presión estática baja','la presión estática sube','no cambia','la masa cambia'],0,'Es la base de la succión bajo un alerón.'),
 tf('En un circuito a gran altura, con aire menos denso, un auto genera menos carga aerodinámica.',true,'q ∝ ρ.'),
 mc('La capa límite es…',['una fina capa de aire adherida a la superficie','un tipo de turbo','la pintura','una pieza del alerón'],0,'Su separación genera estela y resistencia.')
]),
L('Resistencia al avance',
`<p>La <b>resistencia aerodinámica</b> (drag) frena el auto y es lo primero que domina a alta velocidad.</p>
<span class="k">F_d = ½ · ρ · v² · C_d · A<br>P_d = F_d · v &nbsp;(proporcional a v³)</span>
<ul><li><b>C_d</b>: coeficiente de resistencia; un auto de calle moderno ronda 0,25–0,35.</li><li><b>A</b>: área frontal.</li><li>Un F1 con alerones tiene mucho más C_d que un auto de calle porque sacrifica eficiencia por carga.</li></ul>
<div class="tip"><b>Potencia</b>Para ir al doble de velocidad se necesita <b>8 veces</b> más potencia solo para vencer el aire.</div>`,
[
 num('¿Qué resistencia aerodinámica sufre un auto con Cd = 0,30, A = 2,2 m² a 30 m/s? (ρ = 1,225)',363.8,'N',3,'F = 0,5 × 1,225 × 900 × 0,30 × 2,2 ≈ 364 N.'),
 num('¿Qué potencia consume esa resistencia a 30 m/s? (usa F = 364 N)',10.9,'kW',0.2,'P = F·v = 364 × 30 = 10.920 W ≈ 10,9 kW.'),
 mc('Al duplicar la velocidad, la potencia necesaria para vencer la resistencia aerodinámica…',['se duplica','se cuadruplica','se multiplica por 8','queda igual'],2,'P ∝ v³.'),
 tf('Un Cd más bajo significa menor resistencia al avance para el mismo tamaño.',true,'Menos fuerza de arrastre.'),
 mc('Un auto de calle moderno tiene un Cd aproximado de…',['0,05','0,3','1,5','3'],1,'Entre 0,25 y 0,35.')
]),
L('Carga aerodinámica',
`<p>La <b>carga aerodinámica</b> (<i>downforce</i>) es sustentación negativa: empuja al auto contra el suelo y aumenta el agarre sin añadir masa.</p>
${figWing()}
<span class="k">F_z = ½ · ρ · v² · C_L · A</span>
<p>La eficiencia aerodinámica se mide como <b>L/D</b>: carga dividida por resistencia. Una buena aerodinámica de carrera busca mucho L/D.</p>
${figV2()}`,
[
 num('Un auto con Cl·A = 3,5 m² va a 300 km/h (83,33 m/s). ¿Cuánta carga aerodinámica genera? (en kN, ρ = 1,225)',14.9,'kN',0.3,'F = 0,5 × 1,225 × 83,33² × 3,5 ≈ 14.887 N.'),
 mc('Un ala de competición genera carga porque…',['está invertida y crea baja presión por debajo','pesa más','vibra','calienta el aire'],0,'Es un perfil de avión invertido.'),
 tf('La carga aerodinámica aumenta con el cuadrado de la velocidad.',true,'F ∝ v².'),
 mc('¿Qué significa L/D en aerodinámica de competición?',['La eficiencia: carga dividida por resistencia','Longitud/densidad','Velocidad límite','Luz/distancia'],0,'Cuánta carga se obtiene por cada unidad de resistencia.'),
 mc('A baja velocidad, comparado con alta velocidad, la carga aerodinámica es…',['mucho menor','mucho mayor','igual','negativa'],0,'F ∝ v², entonces a la mitad de velocidad, un cuarto.')
]),
L('Efecto suelo y difusor',
`<p>Lo más eficiente es generar carga con el <b>piso</b> del auto. En un <b>túnel Venturi</b> el aire se acelera por la sección estrecha: la presión baja y el auto es succionado contra la pista.</p>
<ul><li><b>Piso con túneles</b>: gran parte de la carga de un F1 moderno.</li><li><b>Difusor</b>: sección que se ensancha al final; ayuda a que el aire se desacelere y recupere presión de forma ordenada, lo que mantiene la succión.</li><li>El efecto suelo es muy sensible a la <b>altura</b> al suelo: si el piso se acerca demasiado, el flujo se bloquea y se pierde carga de golpe.</li><li><b>Porpoising</b>: rebote aerodinámico que aparece en la pista cuando el flujo se pierde y se recupera repetidamente.</li></ul>
<p>La F1 volvió a diseños con mucho efecto suelo en 2022, y las normas actuales siguen condicionando su forma.</p>`,
[
 mc('¿Qué efecto aprovecha el piso con túneles?',['Un túnel Venturi: el aire acelera y baja la presión','El calentamiento del suelo','La inercia del aire','El peso del piloto'],0,'Presión baja bajo el auto.'),
 mc('El porpoising es…',['un rebote cíclico por pérdida y recuperación de carga del piso','un tipo de neumático','un sistema de frenos','una caja de cambios'],0,'El auto sube y baja en recta.'),
 tf('El difusor ayuda a mantener la succión del piso al desacelerar ordenadamente el aire.',true,'Recupera presión sin separar el flujo.'),
 mc('Si el piso se acerca demasiado al suelo, el efecto suelo…',['puede bloquearse y perder carga de golpe','aumenta siempre','no cambia','se invierte'],0,'El flujo se ahoga.'),
 mat('Une cada elemento con su función.',[['Piso','Genera gran parte de la carga'],['Difusor','Expande y desacelera el aire al final'],['Túnel Venturi','Acelera el aire y baja la presión'],['Altura al suelo','Controla la eficiencia del efecto suelo']],'')
]),
L('Alerones, aire sucio y aero activa',
`<ul><li><b>Alerón delantero</b>: primer elemento en tocar el aire; condiciona todo el flujo hacia atrás.</li><li><b>Alerón trasero</b>: da carga al eje trasero. Los ángulos se ajustan según el circuito: alta carga en Mónaco, baja carga en Monza.</li><li><b>Aire sucio</b>: un auto que va detrás recibe aire turbulento y pierde parte de su carga, sobre todo en el eje delantero; seguir de cerca es difícil y se desgastan los neumáticos.</li><li><b>DRS</b> (hasta 2025 en F1): abría un flap del alerón trasero para reducir resistencia y facilitar los adelantamientos.</li><li><b>Aerodinámica activa 2026</b>: los F1 usan modos para rectas (alerones abiertos y menos resistencia) y modos para curva (más carga). Reemplaza al DRS.</li></ul>`,
[
 mc('El “aire sucio” hace que el auto que va detrás…',['pierda parte de su carga aerodinámica','gane más carga','reduzca su peso','aumente su octanaje'],0,'El flujo turbulento reduce la efectividad de sus alas y piso.'),
 mc('¿Qué configuración de alerones se usa en un circuito de muy alta velocidad?',['Baja carga y baja resistencia','Máxima carga','Sin alerón','Alerón delantero enorme y trasero cerrado'],0,'Menos resistencia para más velocidad punta.'),
 tf('El DRS sigue siendo el sistema de ayuda para adelantar en F1 desde 2026.',false,'Fue reemplazado por la aerodinámica activa y el modo de adelantamiento (Overtake Mode).'),
 mc('En 2026 el modo “recta” de la F1 consiste en…',['abrir el ala trasera y bajar elementos del ala delantera para reducir la resistencia','cerrar todos los alerones','activar el motor eléctrico solamente','cambiar neumáticos'],0,'La resistencia baja en recta.'),
 mat('Une cada elemento con su rol.',[['Alerón delantero','Condiciona el flujo hacia atrás'],['Alerón trasero','Da carga al eje trasero'],['Aire sucio','Estela turbulenta del auto de adelante'],['DRS (hasta 2025)','Flap móvil para reducir resistencia']],'')
])
]);

U({branch:'Aerodinámica y electrónica',title:'Electrónica, híbridos y eléctricos',sub:'Sensores, baterías, motores eléctricos y recuperación de energía.',icon:'chip'},[
L('Sensores, ECU y redes',
`<p>La <b>ECU</b> (unidad de control del motor) lee sensores, calcula y comanda actuadores miles de veces por segundo.</p>
<ul><li><b>Sensores</b>: posición de cigüeñal y levas, MAP/MAF (aire), temperatura, posición de acelerador, sonda lambda, detonación.</li><li><b>Actuadores</b>: inyectores, bobinas, mariposa electrónica, válvula wastegate.</li><li><b>Lazo cerrado</b>: la ECU corrige según el resultado medido (por ejemplo, la sonda lambda). <b>Lazo abierto</b>: usa mapas pre-calculados.</li><li><b>Bus CAN</b>: red que comunica los módulos del auto con pocos cables. <b>OBD-II</b>: puerto de diagnóstico estándar.</li></ul>`,
[
 mc('¿Qué sensor informa a la ECU del oxígeno en el escape?',['MAP','Sonda lambda','Sensor de detonación','TPS'],1,'Permite corregir la mezcla en lazo cerrado.'),
 tf('El bus CAN permite que muchos módulos se comuniquen compartiendo pocos cables.',true,'Es una red de datos del vehículo.'),
 mc('En un sistema de lazo cerrado, la ECU…',['corrige usando la medición de un sensor','ignora los sensores','solo usa mapas','apaga el motor'],0,'Realimentación.'),
 mat('Une el sensor con lo que mide.',[['MAP','Presión del colector de admisión'],['Lambda','Oxígeno en el escape'],['Knock','Detonación'],['TPS','Posición del acelerador']],''),
 mc('El puerto OBD-II sirve para…',['leer diagnósticos y datos del auto','cargar el celular','cambiar el aceite','medir neumáticos'],0,'Es la interfaz de diagnóstico.')
]),
L('Electricidad y baterías',
`<p>Para entender los eléctricos hacen falta tres magnitudes:</p>
<span class="k">V = I · R &nbsp;(ley de Ohm)<br>P = V · I &nbsp;(vatios)<br>Energía (kWh) = potencia (kW) × tiempo (h)</span>
<ul><li>Una celda Li-ion tiene ~3,6–3,7 V nominales; se conectan <b>en serie</b> (suma tensión) y <b>en paralelo</b> (suma corriente y capacidad).</li><li>Los autos eléctricos usan packs de ~400 V u ~800 V. A mayor tensión, menos corriente para la misma potencia y cables más finos.</li><li>El <b>BMS</b> controla la carga, la temperatura y el equilibrio de las celdas.</li></ul>`,
[
 num('Un pack entrega 400 V con 250 A. ¿Qué potencia es?',100,'kW',0.5,'P = 400 × 250 = 100.000 W = 100 kW.'),
 num('Una batería de 75 kWh y un consumo de 15 kWh/100 km. ¿Qué autonomía teórica tiene?',500,'km',2,'75 / 15 × 100 = 500 km.'),
 mc('Para la misma potencia, al subir la tensión de 400 V a 800 V, la corriente…',['se reduce a la mitad','se duplica','queda igual','se anula'],0,'I = P/V.'),
 tf('En celdas conectadas en serie se suman las tensiones.',true,'En paralelo se suma la capacidad.'),
 mc('¿Qué hace el BMS?',['Controla y protege las celdas de la batería','Enfría el aceite','Controla la caja de cambios','Mide el viento'],0,'Battery Management System.')
]),
L('Motores eléctricos',
`<p>El motor eléctrico entrega <b>par máximo desde cero rpm</b>, por eso un EV acelera tan fuerte desde parado.</p>
<ul><li><b>Inversor</b>: convierte la corriente continua de la batería en alterna trifásica para el motor y controla su par.</li><li><b>Regeneración</b>: al desacelerar, el motor funciona como generador y recupera energía a la batería.</li><li>Rendimiento muy alto (por encima del 90 %) frente al ~30–35 % de un motor de combustión de calle.</li><li>A altas rpm la potencia se mantiene pero el par cae; muchas veces basta una reducción fija en lugar de caja de varias marchas.</li></ul>`,
[
 mc('¿Qué caracteriza la curva de par de un motor eléctrico?',['Par máximo desde cero rpm','Par nulo a bajas rpm','Par máximo a 8.000 rpm','Par constante a cualquier velocidad siempre'],0,'Por eso la fuerte aceleración inicial.'),
 mc('El inversor sirve para…',['pasar de corriente continua a alterna y controlar el motor','enfriar el aceite','invertir la marcha','cargar el tanque'],0,'Controla el par y la velocidad.'),
 tf('En regeneración, el motor eléctrico actúa como generador.',true,'Recupera energía cinética.'),
 tf('Un motor eléctrico suele tener un rendimiento menor que un motor de combustión.',false,'Suele superar el 90 %.'),
 mc('¿Por qué muchos EV usan una reducción fija?',['El motor eléctrico cubre un amplio rango de rpm con buen par','No pueden tener cajas','Para ahorrar nafta','Para cambiar de eje'],0,'Un rango de funcionamiento muy amplio.')
]),
L('Híbridos y recuperación de energía',
`<ul><li><b>Mild hybrid</b>: pequeño motor eléctrico que asiste al motor térmico; no mueve solo el auto.</li><li><b>Full hybrid</b>: puede mover el auto en modo eléctrico unos kilómetros.</li><li><b>Enchufable (PHEV)</b>: batería grande que se carga a la red.</li></ul>
<p>En competición se habla de <b>ERS</b> (sistema de recuperación de energía):</p>
<ul><li><b>MGU-K</b>: motor/generador conectado al cigüeñal; recupera en frenada y despliega potencia en aceleración.</li><li><b>MGU-H</b>: conectado al turbo; recuperaba calor de los gases de escape. Existió en la F1 de 2014 a 2025 y se elimina en 2026.</li></ul>
<div class="tip"><b>Dato</b>En la F1 de 2026, el motor eléctrico (MGU-K) pasa de 120 kW a unos 350 kW; el V6 aporta unos 400 kW. La potencia queda repartida casi 50-50.</div>`,
[
 mc('El MGU-K recupera energía principalmente…',['en frenada','en la admisión','en el escape del turbo','al arrancar'],0,'Funciona como generador al frenar.'),
 tf('La F1 de 2026 elimina el MGU-H.',true,'Solo queda el MGU-K.'),
 mc('¿Cuánta potencia eléctrica entrega el MGU-K en la F1 de 2026, aproximadamente?',['120 kW','350 kW','35 kW','1.200 kW'],1,'Unos 350 kW.'),
 mat('Une cada tipo de híbrido con su descripción.',[['Mild','Asistencia eléctrica menor'],['Full','Puede moverse en modo eléctrico'],['Enchufable (PHEV)','Se recarga de la red'],['MGU-K','Motor/generador del cigüeñal']],''),
 mc('Frente a un auto de combustión puro, un híbrido mejora su eficiencia sobre todo porque…',['recupera energía al frenar y optimiza el uso del motor térmico','pesa menos siempre','no usa batería','usa más combustible'],0,'Reaprovecha energía que se perdería como calor.')
])
]);

U({branch:'Motorsport',title:'Fórmula 1',sub:'Reglamento, unidad de potencia, coche, neumáticos y reglas de diseño.',icon:'flag'},[
L('El fin de semana de F1',
`<p>La F1 es el campeonato mundial de monoplazas de la FIA. Se disputan <b>dos títulos</b>: pilotos y constructores.</p>
<ul><li><b>Fin de semana estándar</b>: prácticas libres, clasificación (Q1, Q2, Q3) y carrera. En los <b>fines de semana sprint</b> hay una carrera corta adicional.</li><li><b>Puntos en carrera</b>: 25-18-15-12-10-8-6-4-2-1 para los diez primeros.</li><li><b>Safety Car / VSC</b>: neutralizan la carrera; los autos van en fila o a velocidad reducida.</li></ul>
<div class="tw"><table><tr><th>Bandera</th><th>Significado</th></tr><tr><td>Amarilla</td><td>Peligro en pista: no adelantar y reducir</td></tr><tr><td>Roja</td><td>Sesión o carrera detenida</td></tr><tr><td>Azul</td><td>Ceder el paso a un auto más rápido que lo dobla</td></tr><tr><td>A cuadros</td><td>Fin de la sesión o carrera</td></tr></table></div>
<p>En 2026 la parrilla suma un equipo más, hasta 11 equipos y 22 autos.</p>`,
[
 ord('Ordena un fin de semana de F1 estándar.',['Prácticas libres','Clasificación (Q1, Q2, Q3)','Carrera'],'Primero se prueba, después se clasifica y luego se corre.'),
 mc('¿Cuántos puntos recibe el ganador de un Gran Premio?',['10','18','25','30'],2,'Escala 25-18-15-12-10-8-6-4-2-1.'),
 mat('Une cada bandera con su significado.',[['Amarilla','Peligro: no adelantar'],['Roja','Carrera o sesión detenida'],['Azul','Ceder el paso al más rápido'],['A cuadros','Fin de la carrera']],''),
 tf('En F1 se disputan dos campeonatos: pilotos y constructores.',true,'Cada equipo puntúa con sus dos autos.'),
 mc('¿Qué hace el Safety Car?',['Neutraliza la carrera y agrupa a los autos tras él','Cambia los neumáticos','Mide la velocidad','Reabastece combustible'],0,'Permite despejar la pista con seguridad.')
]),
L('La unidad de potencia 2026',
`<p>La F1 sigue usando un <b>V6 turbo de 1,6 litros con ERS</b>, pero el reglamento de 2026 cambia el equilibrio:</p>
<ul><li><b>Motor de combustión (ICE)</b>: unos <b>400 kW</b>.</li><li><b>MGU-K</b> eléctrico: sube de 120 a unos <b>350 kW</b>.</li><li><b>Sin MGU-H</b>: se elimina el recuperador del turbo.</li><li><b>Reparto casi 50/50</b> entre potencia térmica y eléctrica.</li><li><b>Combustible 100 % sostenible</b> (“drop-in”), fabricado con materias que no compiten con la alimentación.</li><li>La batería puede recargarse bastante más por vuelta que los 4 MJ de antes, por eso la gestión de energía pasa a ser parte central de la carrera.</li></ul>

 num('En 2026, suma la potencia aproximada del ICE (400 kW) y del MGU-K (350 kW). ¿Cuántos kW son?',750,'kW',5,'400 + 350 ≈ 750 kW (más de 1.000 hp).'),
 mc('¿Qué pieza elimina la F1 en 2026?',['El MGU-H','El turbo','El V6','El MGU-K'],0,'Se mantiene el turbo y el MGU-K.'),
 tf('En 2026 la potencia queda repartida casi mitad térmica y mitad eléctrica.',true,'Aproximadamente 50/50.'),
 mc('El combustible de F1 en 2026 es…',['100 % sostenible y compatible con motores existentes (drop-in)','Hidrógeno','Diésel','Etanol puro de maíz'],0,'Un combustible avanzado sostenible.'),
 mat('Une cada elemento con su rol.',[['ICE','Motor V6 turbo de 1,6 L'],['MGU-K','Motor/generador del cigüeñal'],['Overtake Mode','Potencia eléctrica extra para adelantar'],['ERS','Sistema de recuperación de energía']],'')
]),
L('El coche de 2026',
`<p>Los coches de 2026 son <b>más compactos, ligeros y con aerodinámica activa</b>:</p>
<ul><li><b>Peso mínimo</b>: 768 kg (antes 800 kg).</li><li><b>Batalla</b>: 3.400 mm (antes 3.600 mm).</li><li><b>Piso</b>: 100 mm más angosto.</li><li><b>Neumáticos</b>: 25 mm más angostos adelante y 30 mm atrás.</li><li><b>Aero activa</b>: en las rectas, el <b>modo recta</b> abre el ala trasera y baja elementos del ala delantera para reducir resistencia.</li><li><b>Overtake Mode</b>: reemplaza al DRS; se habilita si se está a menos de 1 segundo del rival en el punto de detección y entrega 0,5 MJ extra de recarga.</li></ul>`,
[
 num('El peso mínimo baja de 800 kg a 768 kg. ¿Cuántos kg se reducen?',32,'kg',0,'800 − 768 = 32 kg.'),
 num('La batalla pasa de 3.600 mm a 3.400 mm. ¿Cuántos milímetros se acorta?',200,'mm',0,'3.600 − 3.400 = 200 mm.'),

 mc('Para habilitar el Overtake Mode hay que estar…',['a menos de 1 segundo del rival en el punto de detección','primero en la clasificación','en la boxes','en la última vuelta'],0,'Una detección por vuelta.'),
 tf('Los neumáticos delanteros de 2026 son 25 mm más angostos que los de 2025.',true,'Y los traseros, 30 mm.')
]),
L('Neumáticos y estrategia en F1',
`<p>Pirelli provee los neumáticos. Hay varios compuestos de seco, de más duro (más duradero) a más blando (más rápido), y neumáticos para mojado:</p>
<ul><li><b>Blando (rojo)</b>, <b>medio (amarillo)</b>, <b>duro (blanco)</b>.</li><li><b>Intermedio (verde)</b> y <b>lluvia extrema (azul)</b>.</li><li>En una carrera seca hay que usar <b>al menos dos compuestos distintos</b>.</li></ul>
<p>La <b>degradación</b> es la pérdida de agarre con las vueltas. Estrategia es elegir cuántas paradas hacer y con qué compuesto para minimizar el tiempo total de carrera.</p>`,

 mc('¿Cuál de estos es un neumático para pista muy mojada?',['Azul','Rojo','Amarillo','Blanco'],0,'Lluvia extrema.')
]),
L('Reglas que moldean el diseño',
`<p>Los reglamentos técnicos y financieros definen cómo se diseña un F1:</p>
<ul><li><b>Tope de gasto (cost cap)</b>: en 2026 sube de 135 a unos <b>215 millones de dólares</b>; el de unidades de potencia, de 95 a unos <b>130 millones</b>.</li><li><b>Límites de pruebas aerodinámicas (ATR)</b>: túnel de viento y CFD se restringen; más horas para quienes van peor en el campeonato.</li><li><b>Peso mínimo</b>: se completa con lastre ubicado donde convenga (bajo y centrado).</li><li><b>Planos de referencia</b>: limitan la forma del piso y de las alas.</li></ul>`,

 mat('Une cada regla con su efecto.',[['Cost cap','Limita el gasto anual'],['ATR','Limita túnel de viento y CFD'],['Peso mínimo','Evita llevar autos demasiado livianos'],['Plano de referencia','Define límites de forma del piso']],'')
])
]);

U({branch:'Motorsport',title:'Resistencia y WEC',sub:'Le Mans, Hypercar, LMGT3 y cómo se gana una carrera de 24 horas.',icon:'clock'},[
L('Qué es una carrera de resistencia',
`<p>En resistencia gana quien recorre más distancia en un tiempo fijo, no quien llega primero a un número de vueltas. El <b>WEC</b> (Campeonato Mundial de Resistencia de la FIA) incluye las <b>24 Horas de Le Mans</b>, en el Circuit de la Sarthe.</p>
<ul><li>Cada auto lleva <b>tres pilotos</b> que se turnan; las reglas limitan cuánto puede conducir cada uno.</li><li>Se corre de día, de noche y a veces con lluvia.</li><li>Hay <b>autos de distintas velocidades en pista a la vez</b>: los rápidos doblan a los lentos constantemente.</li><li>Importan la <b>confiabilidad</b>, el consumo y el trato al auto tanto como la velocidad pura.</li></ul>
<p>En Le Mans los líderes superan los <b>5.000 km</b> en un día.</p>`,
[
 mc('En una carrera de resistencia a tiempo fijo, gana quien…',['recorre más distancia en el tiempo','llega a las 100 vueltas primero','tiene el mejor motor','sale primero'],0,'Se cuenta la distancia al finalizar el tiempo.'),
 num('Un auto recorre 5.000 km en 24 horas. ¿Cuál es su velocidad media en km/h (aprox.)?',208.3,'km/h',1,'5.000 / 24 ≈ 208 km/h, incluyendo paradas.'),
 tf('En Le Mans compiten en simultáneo autos de distintas categorías y velocidades.',true,'Hypercar y LMGT3 comparten pista.'),
 mc('¿Cuántos pilotos suele tener cada auto en las 24 Horas de Le Mans?',['Uno','Dos','Tres','Seis'],2,'Se alternan en stints.'),
 mc('En resistencia, además de la velocidad, es clave…',['la confiabilidad','el color','el diseño de la boxes','la edad del piloto'],0,'Un auto que se rompe pierde más de lo que gana corriendo rápido.')
]),
L('Hypercar: LMH y LMDh',
`<p><b>Hypercar</b> es la clase reina del WEC desde 2021. Convive con dos reglamentos técnicos:</p>
<ul><li><b>LMH (Le Mans Hypercar)</b>: libertad para diseñar casi todo el auto.</li><li><b>LMDh</b>: chasis de un proveedor homologado (Dallara, Ligier, Multimatic u Oreca) con sistema híbrido estándar; los fabricantes aportan el motor y la carrocería.</li></ul>
<p>Las potencias se regulan por <b>Balance of Performance (BoP)</b>: se ajusta peso y potencia (del orden de 500 kW, unos 680 CV, y unos 1.030 kg) para que distintas arquitecturas compitan parejo. Desde 2026 se suma el <b>handicap por éxito</b>: los buenos resultados se traducen en una penalización de tiempo por vuelta en cada fecha salvo Le Mans.</p>
<div class="tip"><b>Híbridos</b>Desde 2026 todo Hypercar nuevo homologado debe llevar sistema de recuperación de energía.</div>`,
[
 mat('Une cada reglamento con su rasgo.',[['LMH','Libertad de diseño del chasis'],['LMDh','Chasis de proveedor homologado'],['BoP','Ajusta peso y potencia'],['Handicap por éxito','Penaliza buenos resultados recientes']],''),
 mc('¿Quién fabrica el chasis de un LMDh?',['Uno de los proveedores homologados','Siempre el equipo','La FIA','Pirelli'],0,'Dallara, Ligier, Multimatic u Oreca.'),
 tf('Hypercar es la clase más rápida del WEC.',true,'Es la clase prototipo de máximo nivel.'),
 num('Si un Hypercar tiene 500 kW, ¿cuántos CV son aproximadamente? (1 CV = 0,7355 kW)',680,'CV',5,'500 / 0,7355 ≈ 680 CV.'),
 mc('El handicap por éxito se aplica…',['en todas las fechas salvo Le Mans','solo en Le Mans','solo en Spa','nunca'],0,'Es una novedad de 2026.')
]),
L('LMGT3 y el espíritu Pro-Am',
`<p>La clase <b>LMGT3</b> reemplazó a GTE desde 2024. Usa autos basados en el reglamento <b>FIA GT3</b>, adaptados con elementos propios del WEC.</p>
<ul><li>Cada tripulación incluye un piloto <b>Bronce</b> (amateur): es una clase <b>Pro-Am</b>.</li><li>Solo pueden participar fabricantes con una producción relevante de autos de calle (más de 2.500 al año).</li><li>Los autos llevan <b>paneles luminosos de número</b> y luces que facilitan identificarlos de noche.</li><li>Se regulan con <b>BoP</b>, como los GT3.</li></ul>`,
[
 mc('LMGT3 está basado en…',['el reglamento FIA GT3','la F1','el Dakar','el karting'],0,'Comparte plataforma con GT3.'),
 tf('Cada tripulación de LMGT3 debe incluir un piloto Bronce.',true,'Es una clase Pro-Am.'),
 mc('¿Por qué los autos llevan paneles luminosos de número?',['Para identificarlos mejor de noche','Por estética','Por publicidad','Para mejorar la aerodinámica'],0,'Es una adaptación para resistencia.'),
 mc('La BoP en LMGT3 sirve para…',['igualar el rendimiento entre modelos distintos','aumentar el precio','cambiar el color','el reglamento deportivo'],0,'Competencia pareja entre marcas.'),
 mat('Une cada término con su descripción.',[['Pro-Am','Mezcla de profesionales y amateurs'],['Bronce','Categoría de piloto amateur'],['LMGT3','Clase GT del WEC'],['BoP','Compensa diferencias entre autos']],'')
]),
L('Estrategia de resistencia',
`<p>En 24 horas, el rendimiento se construye con <b>consistencia</b> y buenas decisiones:</p>
<ul><li><b>Stints</b>: cada tramo entre paradas. Se busca el máximo posible con el combustible y energía disponibles.</li><li><b>Combustible</b>: el consumo manda sobre cuántas vueltas se hacen entre paradas.</li><li><b>Neumáticos</b>: a veces se hacen dobles stints con el mismo juego para ganar tiempo en boxes.</li><li><b>Amarilla de pista completa (FCY) y zonas lentas</b>: neutralizaciones menos drásticas que el Safety Car.</li><li><b>Tráfico</b>: doblar a los GT3 sin perder tiempo ni arriesgar contacto.</li></ul>`,
[
 num('Un auto hace 12 vueltas por tanque y la carrera tiene 120 vueltas. ¿Cuántas paradas por combustible necesita como mínimo?',9,'paradas',0,'120 / 12 = 10 tramos (stints), o sea 9 paradas entre ellos.'),
 mc('Un doble stint de neumáticos significa…',['usar el mismo juego en dos tramos consecutivos','cambiar dos veces','correr con doble ancho','usar dos compuestos a la vez'],0,'Ahorra tiempo en boxes.'),
 tf('El FCY (Full Course Yellow) neutraliza la carrera sin sacar el Safety Car.',true,'Reduce la velocidad en toda la pista.'),
 mc('En resistencia, ¿qué suele costar más: un error de conducción o una avería?',['La avería, porque puede sacar al auto de carrera','El error siempre','Ninguna','La pausa'],0,'La confiabilidad es decisiva.'),
 mc('¿Por qué importa el consumo de combustible?',['Define cuántas vueltas se hacen entre paradas','Cambia el color','Reduce el peso del piloto','Mejora el frenado'],0,'Menos paradas, más vueltas.')
])
]);

U({branch:'Motorsport',title:'Autos GT3',sub:'Autos de calle convertidos en máquinas de carrera, igualados por BoP.',icon:'car'},[
L('Qué es un GT3',
`<p>El <b>GT3</b> es un reglamento de la FIA (gestionado comercialmente por SRO) para autos deportivos <b>derivados de modelos de calle</b>, pensados para equipos y pilotos clientes. Es la categoría de autos GT más extendida del mundo.</p>

[
 mc('Un GT3 es…',['un auto derivado de un modelo de calle preparado para competir','un monoplaza','un prototipo sin relación con autos de calle','un camión'],0,'Parte de un deportivo de producción.'),

U({branch:'Motorsport',title:'Ingeniería de carrera y datos',sub:'Telemetría, setup, simulación y estrategia.',icon:'chart'},[
L('Telemetría y análisis de datos',
`<p>Un auto de competición tiene cientos de sensores. Los ingenieros analizan <b>trazas</b> (señales contra distancia o tiempo):</p>
<ul><li><b>Velocidad</b>, <b>acelerador</b>, <b>freno</b> (presión), <b>ángulo del volante</b>, <b>marcha</b>, <b>rpm</b>.</li><li><b>Aceleración lateral y longitudinal</b> (los “g”).</li><li><b>Temperaturas</b> de neumáticos, frenos, aceite y agua.</li></ul>
<p>Comparar dos vueltas con un <b>delta de tiempo</b> muestra dónde se gana o se pierde: en la frenada, en el punto de giro o en la aceleración de salida. Mirar solo el tiempo total no dice por qué.</p>`,
[
 mc('Una traza de datos de velocidad contra distancia permite ver…',['dónde se frena, se gira y se acelera en cada punto de la pista','el color del auto','el precio','el nombre del piloto'],0,'Se compara vuelta a vuelta.'),

 tf('Los ingenieros solo miran el tiempo total de la vuelta, no las trazas.',false,'Las trazas explican por qué cambia el tiempo.'),
 mat('Une cada señal con lo que informa.',[['Presión de freno','Cuánto y cuándo frena el piloto'],['Posición del acelerador','Cuánto acelera el piloto'],['Aceleración lateral','Los “g” en curva'],['Temperatura del neumático','Estado de trabajo de la goma']],''),
 num('Un auto recorre una vuelta de 5.000 m en 100 s. ¿Qué velocidad media tiene en km/h?',180,'km/h',0.5,'50 m/s × 3,6 = 180 km/h.')
]),
L('Reglajes (setup)',
`<p>El <b>setup</b> es el conjunto de ajustes con los que sale el auto a pista. Los principales:</p>
<ul><li><b>Presión de neumáticos</b> y <b>camber/convergencia</b>.</li><li><b>Resortes, amortiguadores y barras</b>; <b>altura</b> del auto.</li><li><b>Alas</b>: ángulo de ataque.</li><li><b>Diferencial</b>, <b>reparto de frenada</b>, mapas del motor.</li></ul>

 mat('Une cada reglaje con su efecto típico.',[['Presión de neumático','Cambia parche de contacto y temperatura'],['Ángulo de ala','Cambia carga y resistencia'],['Altura del auto','Cambia CG y piso'],['Reparto de frenada','Ajusta cuánto frena cada eje']],''),
 mc('¿Qué efecto suele tener aumentar el ángulo del ala trasera?',['Más carga trasera y más resistencia','Menos carga','Menos resistencia','Nada'],0,'Más agarre trasero a costa de velocidad punta.')
]),
L('Simulación y herramientas',
`<p>Antes de pista, se diseña y se prueba virtualmente:</p>
<ul><li><b>CFD</b> (dinámica de fluidos computacional): simula el aire alrededor del auto.</li><li><b>Túnel de viento</b>: se prueban modelos a escala (en F1, 60 %) con una cinta móvil que simula el suelo.</li><li><b>Simulador</b>: el piloto conduce un auto virtual para probar setups sin gastar neumáticos ni combustible.</li><li><b>Simulación de vuelta</b>: calcula tiempos según potencia, masa, agarre y aerodinámica.</li></ul>

L('Estrategia y paradas en boxes',

<ul><li><b>Undercut</b>: parar antes que el rival para aprovechar neumáticos nuevos y pasarlo cuando él pare.</li><li><b>Overcut</b>: alargar el stint con neumáticos que aún rinden y salir delante.</li><li><b>Safety Car</b>: puede abaratar mucho una parada, porque la pista va lenta.</li></ul>

const lvlT=n=>25*(n-1)*(n+2);
function lvlOf(xp){let n=1;while(lvlT(n+1)<=xp)n++;return n}
function lvlProg(xp){const n=lvlOf(xp),a=lvlT(n),b=lvlT(n+1);return{n,cur:xp-a,need:b-a,pct:(xp-a)/(b-a)*100}}

function touchStreak(){
  const t=dk();if(S.last===t)return;
  S.streak=(S.last===ago(1))?S.streak+1:1;S.last=t;S.st.maxStreak=Math.max(S.st.maxStreak,S.streak);
}
function protectStreak(){
  if(!S.last)return;const t=dk();const gap=daysBetween(S.last,t);
  if(gap>=2){const miss=gap-1;
    if(S.freezes>=miss){S.freezes-=miss;S.last=ago(1);for(let i=1;i<=miss;i++)(S.frozen=S.frozen||{})[ago(i)]=1;S.pending.push({t:'freeze',n:miss})}
    else S.streak=0}
}
function addXP(n){
  if(n<=0)return;const before=lvlOf(S.xp);S.xp+=n;const t=dk();S.days[t]=(S.days[t]||0)+n;touchStreak();qprog('xp',n);
  const after=lvlOf(S.xp);for(let l=before+1;l<=after;l++){S.coins+=25;S.pending.push({t:'level',n:l})}
}
const addCoins=n=>{S.coins+=n};

/* objetivos diarios */
function qstate(){const t=dk();return S.q[t]||(S.q[t]={claimed:{}})}
function qprog(k,n=1){const q=qstate();q[k]=(q[k]||0)+n}
function todayQuests(){
  const r=rng(hashStr('quests'+dk()));const pool=shuffle(QUESTS,r),out=[];
  for(const q of pool){if(out.length>=3)break;if(q.id==='q-les3'&&out.some(x=>x.id==='q-les1'))continue;if(q.id==='q-les1'&&out.some(x=>x.id==='q-les3'))continue;out.push(q)}
  return out;
}
function claimQuest(id){
  const q=QUESTS.find(x=>x.id===id),st=qstate();if(!q||st.claimed[id]||(st[q.key]||0)<q.goal)return false;
  st.claimed[id]=1;S.st.quests++;addCoins(q.c);addXP(q.xp);checkBadges();save();return q;
}
const questsToClaim=()=>todayQuests().filter(q=>{const st=qstate();return !st.claimed[q.id]&&(st[q.key]||0)>=q.goal}).length;

/* insignias y certificados */
function checkBadges(){
  BADGES.forEach(b=>{if(!S.badges[b.id]&&b.t(S)){S.badges[b.id]=dk();addCoins(b.c);S.pending.push({t:'badge',id:b.id})}});
  certsDone().forEach(j=>{if(!S.certs[j.id]){S.certs[j.id]=dk();S.pending.push({t:'cert',id:j.id})}});
}

const weekId=(d=new Date())=>{const m=new Date(d);m.setHours(0,0,0,0);m.setDate(m.getDate()-((m.getDay()+6)%7));return dk(m)};
const weekXP=id=>{let t=0;const s=parseDk(id);for(let i=0;i<7;i++){const d=new Date(s);d.setDate(d.getDate()+i);t+=S.days[dk(d)]||0}return t};
const BNAMES=['Mateo','Lucía','Tomás','Valentina','Joaquín','Camila','Bruno','Martina','Facundo','Sofía','Nicolás','Julieta','Agustín','Emma','Lautaro','Renata','Ignacio','Abril','Santiago','Delfina','Franco','Olivia','Gonzalo','Pilar','Ramiro','Catalina','Manuel','Jazmín','Thiago','Malena','Bautista','Alma','Ciro','Nora'];
const weekFrac=()=>{const s=parseDk(weekId());return Math.min(1,Math.max(0,(Date.now()-s.getTime())/(7*864e5)))};
function bots(id,tier,t){
  const r=rng(hashStr(id+':'+tier)),base=[120,200,320,480,700,1000][tier],used=new Set(),out=[];
  const hc=SHOP.helmet.map(x=>x.c),sc=SHOP.stripe.map(x=>x.c),em=SHOP.emblem.map(x=>x.icon),bg=SHOP.bg.map(x=>x.c);
  while(out.length<29){
    const nm=BNAMES[Math.floor(r()*BNAMES.length)]+' '+String.fromCharCode(65+Math.floor(r()*26))+'.';if(used.has(nm))continue;used.add(nm);
    const target=Math.round(base*(0.25+r()*1.5)),ph=r()*6,f=Math.min(1,Math.max(0,Math.pow(t,0.9)+0.08*Math.sin(ph+t*14)*Math.sin(Math.PI*t)));
    out.push({n:nm,xp:Math.round(target*f),av:{helmet:hc[Math.floor(r()*hc.length)],stripe:sc[Math.floor(r()*sc.length)],emblem:em[Math.floor(r()*em.length)],bg:bg[Math.floor(r()*bg.length)]}});
  }
  return out;
}
function leagueTable(){
  const id=weekId(),tier=S.league.tier,me={n:S.profile?S.profile.name:'Tú',xp:weekXP(id),me:true,av:myAv()};
  const rows=bots(id,tier,weekFrac()).concat([me]).sort((a,b)=>b.xp-a.xp||(a.me?-1:1));
  return rows.map((r,i)=>({...r,rank:i+1}));
}
function leagueRoll(){
  const cur=weekId(),L=S.league;
  if(!L.week){L.week=cur;return}
  if(L.week===cur)return;
  const xp=weekXP(L.week);let res={res:'idle',week:L.week};
  if(xp>0){
    const rank=1+bots(L.week,L.tier,1).filter(b=>b.xp>xp).length;
    if(rank<=7&&L.tier<LEAGUES.length-1){L.tier++;S.st.promos++;res={res:'up',rank,tier:L.tier};S.pending.push({t:'league',...res})}
    else if(rank>25&&L.tier>0){L.tier--;res={res:'down',rank,tier:L.tier};S.pending.push({t:'league',...res})}
    else res={res:'stay',rank};
  }
  L.last=res;L.week=cur;
}
function timeLeftWeek(){const e=parseDk(weekId());e.setDate(e.getDate()+7);let ms=e-Date.now();const d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5);return d>0?`${d} d ${h} h`:`${h} h`}

let AC=null;
function beep(k){
  if(!S.sound)return;
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime;
    const seq={ok:[[660,0],[880,.09]],no:[[200,0],[150,.12]],lvl:[[523,0],[659,.1],[784,.2],[1046,.32]],done:[[523,0],[659,.1],[784,.2]],coin:[[988,0],[1319,.07]]}[k]||[];
    seq.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=k==='no'?'sawtooth':'triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,t+d);g.gain.exponentialRampToValueAtTime(.1,t+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d+.17);o.connect(g);g.connect(AC.destination);o.start(t+d);o.stop(t+d+.2)});
  }catch(e){}
}
function toast(title,sub,icon='medal'){

  $('#toasts').appendChild(d);setTimeout(()=>{d.style.transition='opacity .4s';d.style.opacity='0';setTimeout(()=>d.remove(),450)},3800);
}

    const f=$('#mrow button');f&&f.focus();

const reduceMotion=()=>window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function confetti(n=90){
  if(reduceMotion())return;const c=$('#fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const cols=['#E5322D','#F0AA14','#2F7DE1','#1C9E5E','#C23B8F','#FFFFFF'];
  const ps=Array.from({length:n},()=>({x:innerWidth/2+(Math.random()-.5)*160,y:innerHeight*.55,vx:(Math.random()-.5)*14,vy:-8-Math.random()*10,s:5+Math.random()*7,r:Math.random()*6,c:cols[Math.floor(Math.random()*cols.length)],l:0}));
  let f=0;(function tick(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(++f<110)requestAnimationFrame(tick);else x.clearRect(0,0,c.width,c.height)})();
}
function floatXP(txt,el){
  if(reduceMotion())return;const r=(el||document.body).getBoundingClientRect();
  const d=document.createElement('div');d.className='xpf';d.textContent=txt;d.style.left=(el?r.left+r.width/2-20:innerWidth/2-20)+'px';d.style.top=(el?r.top:innerHeight/2)+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),1000);
}

/* avisos pendientes: nivel, insignias, liga, certificados */
let FLUSHING=false;
async function flush(){
  if(FLUSHING||($('#lesson')&&!$('#lesson').hidden)||!S.profile)return;
  FLUSHING=true;
  while(S.pending.length){
  const p=S.pending;S.pending=[];save();
  for(const n of p){
    if(n.t==='level'){beep('lvl');confetti(140);const rt=rankTitle(n.n),nw=RANKS.some(r=>r[0]===n.n);
      await showModal(`<div style="font-size:72px;color:var(--accent);display:grid;place-items:center">${ic('bolt','fill')}</div><div class="mono">NIVEL ALCANZADO</div><h2>¡Nivel ${n.n}!</h2><p>${nw?`Nuevo rango: <b>${rt}</b>. `:''}Ganaste 25 tuercas.</p>`,[{t:'Seguir'}])}
    else if(n.t==='badge'){const b=BADGES.find(x=>x.id===n.id);if(b){beep('coin');toast('Insignia: '+b.n,b.d+' +'+b.c+' tuercas',b.i)}}
    else if(n.t==='cert'){const j=journey(n.id);beep('lvl');confetti(120);await showModal(`<div style="font-size:72px;color:var(--gold);display:grid;place-items:center">${ic('book')}</div><div class="mono">CERTIFICADO DESBLOQUEADO</div><h2>${j.n}</h2><p>Completaste toda la ruta. Lo encontrás en tu perfil.</p>`,[{t:'Ver certificado',fn:()=>{PTAB='certs';setView('perfil')}},{t:'Cerrar',ghost:true}])}
    else if(n.t==='league'){const up=n.res==='up';beep(up?'lvl':'no');if(up)confetti(100);await showModal(`<div style="font-size:64px;color:${LEAGUES[n.tier][1]};display:grid;place-items:center">${ic(up?'trophy':'flag')}</div><div class="mono">RESULTADO SEMANAL</div><h2>${up?'¡Ascendiste!':'Descendiste'}</h2><p>Terminaste ${n.rank}.º y ahora competís en <b>${LEAGUES[n.tier][0]}</b>.</p>`,[{t:'Seguir'}])}
    else if(n.t==='freeze'){toast('Protector de racha usado','Salvó tu racha de '+S.streak+' días.','snow')}
  }
  }
  FLUSHING=false;renderTop();renderNav();
}

/* ---------- barra lateral reutilizable ---------- */
function weekStrip(){
  const t=new Date(),mon=parseDk(weekId()),lab=['L','M','X','J','V','S','D'];
  return `<div class="week">${lab.map((l,i)=>{const d=new Date(mon);d.setDate(d.getDate()+i);const k=dk(d);const on=S.days[k]>0,fz=S.frozen&&S.frozen[k],td=k===dk();
    return `<span class="${on?'on':fz?'fz':''} ${td?'td':''}"><i>${on?ic('flame','fill'):fz?ic('snow'):''}</i>${l}</span>`}).join('')}</div>`;
}
function dailyCard(){
  const dn=!!S.daily[dk()];
  return `<div class="dc${dn?' done':''}"><h3>Desafío del día</h3><b>${dn?'¡Completado!':'5 preguntas mezcladas'}</b><p>${dn?'Vuelve mañana por uno nuevo.':'Gana 25 XP y 15 tuercas. Cambia todos los días.'}</p><button class="btn" data-a="daily">${dn?'Repetir':'Correr'}</button></div>`;
}
function questsCard(){
  return `<div class="card"><div class="ct"><h3>Objetivos de hoy</h3></div>${todayQuests().map(q=>{const st=qstate(),p=Math.min(q.goal,st[q.key]||0),ok=p>=q.goal,cl=st.claimed[q.id];
    return `<div class="q-row"><b>${q.t}</b><div class="rw">${cl?ic('check'):ok?`<button class="btn sm gold" data-a="claim" data-v="${q.id}">Cobrar</button>`:`+${q.xp} XP`}</div><div class="bar"><i style="width:${p/q.goal*100}%"></i></div></div>`}).join('')}</div>`;
}
function sideCards(full){
  const L=lvlProg(S.xp),g=goalXP(),tx=todayXP();
  let h=dailyCard()+questsCard();
  if(!full)return h;
  const rows=leagueTable(),me=rows.find(r=>r.me);
  h=`<div class="card"><div class="ct"><h3>Tu nivel</h3><button data-a="go" data-v="perfil">Perfil</button></div><div style="display:flex;gap:14px;align-items:center">${gaugeSVG(L.pct,84,L.n)}<div><b style="font-family:var(--f-disp);font-size:22px;text-transform:uppercase">${esc(myTitle())}</b><div class="mono">${L.cur} / ${L.need} XP al nivel ${L.n+1}</div></div></div><div class="bar"><i style="width:${Math.min(100,tx/g*100)}%;background:var(--good)"></i></div><div class="mono">Meta diaria: ${Math.min(tx,g)} / ${g} XP</div></div>`+h;
  h+=`<div class="card"><div class="ct"><h3>Racha</h3><button data-a="streak">Detalles</button></div><div style="display:flex;align-items:center;gap:10px"><span style="font-size:34px;color:var(--flame)">${ic('flame','fill')}</span><b style="font-family:var(--f-mono);font-size:26px">${S.streak}</b><span class="mono">días seguidos</span></div>${weekStrip()}</div>`;

  return h;
}

function vLearn(v){
  const j=journey(S.journey),pr=jProg(j),cur=curNode(j),col=COLORS[JOURNEYS.indexOf(j)%COLORS.length];
  let h=`<div class="vlearn"><div><div class="nn stack">${sideCards(false)}</div><div class="card jh" style="--c:${col};margin-top:16px"><span class="jic">${ic(j.icon)}</span><div class="tx"><div class="mono">RUTA ACTUAL · ${Math.round(pr.pct)} %</div><h2>${j.n}</h2><div class="bar"><i style="width:${pr.pct}%"></i></div></div><button class="btn ghost sm" data-a="go" data-v="rutas">Cambiar ruta</button></div>`;
  let lastB='',pat=[0,30,46,30,0,-30,-46,-30];
  j.units.forEach(ui=>{
    const u=UNITS[ui];
    if(u.branch!==lastB){lastB=u.branch;h+=`<div class="branch"><span>${esc(u.branch)}</span></div>`}
    h+=`<section class="unit" style="--c:${u.color};--cc:${u.color}" id="${u.id}"><div class="banner"><div class="tx"><small>Unidad ${ui+1} · ${unitCount(u)}/${unitTotal(u)}</small><h2>${esc(u.title)}</h2><p>${esc(u.sub)}</p></div><span class="gl">${ic(u.icon)}</span></div><div class="nodes">`;
    u.lessons.forEach((l,li)=>{
      const st=S.done[l.id],un=unlocked(u,li),isCur=cur&&cur.id===l.id;
      h+=nodeHTML({id:l.id,ui,li,st,un,isCur,icon:st?'check':un?u.icon:'lock',name:l.title,dx:pat[li%pat.length],test:false});
    });
    const tOpen=testOpen(u),ts=S.tests[u.id];
    h+=nodeHTML({id:u.id+'t',ui,li:-1,st:ts,un:tOpen,isCur:cur&&cur.id===u.id+'t',icon:tOpen?'trophy':'lock',name:'Examen de unidad',dx:pat[u.lessons.length%pat.length],test:true});
    h+='</div></section>';
  });
  h+=`</div><aside class="rcol dsk stack">${sideCards(true)}</aside></div>`;
  v.innerHTML=h;
  if(!SCROLLED){SCROLLED=true;const c=$('.node.cur',v);if(c)setTimeout(()=>c.scrollIntoView({block:'center'}),60)}
}
function nodeHTML(o){
  const stars=Number(o.st)||0;
  return `<div class="nw" style="--dx:${o.dx}px" data-id="${o.id}">${o.isCur&&!o.st?'<span class="go">Empezar</span>':''}<button class="node${o.un?'':' lock'}${o.test?' test':''}${o.test&&o.st?' gold':''}${o.isCur?' cur':''}" data-a="node" data-v="${o.id}" data-ui="${o.ui}" data-li="${o.li}" aria-label="${esc(o.name)}"><span class="hx">${ic(o.icon)}</span></button><div class="nm">${esc(o.name)}</div>${o.st?`<div class="stars">${[1,2,3].map(i=>`<span class="${i<=stars?'':'off'}">${ic('star','fill')}</span>`).join('')}</div>`:''}</div>`;

function openPop(btn){
  const old=$('.pop');const was=old&&old.parentNode===btn.closest('.nw');
  $$('.pop').forEach(p=>p.remove());$$('.nw.open').forEach(n=>n.classList.remove('open'));
  if(was){OPENN=null;return}
  const ui=+btn.dataset.ui,li=+btn.dataset.li,u=UNITS[ui],nw=btn.closest('.nw'),locked=btn.classList.contains('lock');
  let t,p,b;
  if(li<0){t='Examen de unidad';p=locked?'Completa todas las lecciones de la unidad para desbloquearlo.':'10 preguntas mezcladas de toda la unidad. Cuantos menos errores, más estrellas.';b=locked?'':`<button class="btn" data-a="test" data-ui="${ui}">${S.tests[u.id]?'Repetir':'Empezar'}</button>`}
  else{const l=u.lessons[li];t=l.title;p=locked?'Completa la lección anterior para desbloquear esta.':`Lección ${li+1} de ${u.lessons.length} · ${l.qs.length} preguntas.`;b=locked?'':`<button class="btn" data-a="lesson" data-ui="${ui}" data-li="${li}">${S.done[l.id]?'Repetir':'Empezar'}</button><button class="btn sec" data-a="theory" data-ui="${ui}" data-li="${li}" aria-label="Solo teoría">${ic('book')}</button>`}
  const d=document.createElement('div');d.className='pop';d.style.setProperty('--c',u.color);d.style.setProperty('--cc',u.color);
  d.innerHTML=`<b>${esc(t)}</b><p>${p}</p><div class="row">${b}</div>`;nw.appendChild(d);nw.classList.add('open');
}

}

function shell(main,foot,opts={}){
  const pct=run.total&&run.phase==='q'?Math.round(run.correct/run.total*100):0;
  const fuel=Array.from({length:MAXH},(_,i)=>`<span class="${i<run.hearts?'':'gone'}">${ic('fuel','fill')}</span>`).join('');
  LS.innerHTML=`<div class="lt"><button class="x" id="lx" aria-label="Salir">${ic('close')}</button><div class="pbar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i><span class="carx" style="left:${pct}%">${ic('car','fill')}</span></div>${run.mode==='theory'||opts.noHud?'':`<div class="combo" id="cb" title="Racha de aciertos">${run.combo>=2?ic('flame','fill')+run.combo:''}</div><div class="fuel" aria-label="${run.hearts} de ${MAXH} tanques">${fuel}</div>`}</div><div class="lm" id="lm">${main}</div><div class="lf" id="lf"><div class="lf-in">${foot}</div></div>`;
  $('#lx').onclick=()=>{if(run.phase==='q'&&!run.over)confirmExit();else closeRun()};
}
async function confirmExit(){
  const i=await showModal('<h2>¿Salir?</h2><p>Perderás el avance de esta práctica.</p>',[{t:'Seguir',cls:''},{t:'Salir',ghost:true}]);
  if(i===1)closeRun();
}
function speakBtn(txt){return S.tts&&'speechSynthesis' in window?`<button class="spk" data-say="${esc(plain(txt)).slice(0,1500)}">${ic('sound')} Escuchar</button>`:''}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='es-AR';speechSynthesis.speak(u)}catch(e){}}

function renderTheory(){
  const last=run.pi===run.pages.length-1,pg=run.pages[run.pi];
  shell(`<div class="th"><div class="kick">Teoría · ${esc(run.sub)}</div><h2>${run.title}</h2>${speakBtn(pg)}${pg}</div>`,
    `<div style="flex:1" class="mono">${run.pages.length>1?`Parte ${run.pi+1} de ${run.pages.length}`:''}</div>${run.pi>0?'<button class="btn ghost" id="pv">Atrás</button>':''}<button class="btn" id="nx">${!last?'Siguiente':run.mode==='theory'?'Cerrar':'Practicar'}</button>`,{noHud:run.mode==='theory'});
  $('#lm').scrollTop=0;
  const pv=$('#pv');if(pv)pv.onclick=()=>{run.pi--;renderTheory()};
  $('#nx').onclick=()=>{if(!last){run.pi++;renderTheory()}else if(run.mode==='theory')closeRun();else{run.phase='q';nextQ()}};
}
function nextQ(){if(!run.queue.length)return finish();run.cur=run.queue.shift();run.hintUsed=false;renderQ()}
const QLABEL={mc:'Elige la respuesta correcta',tf:'¿Verdadero o falso?',ord:'Ordena los elementos',mat:'Une cada pareja',num:'Calcula y escribe el resultado',diag:'Diagnóstico',fill:'Completa la oración'};
function renderQ(){
  const q=run.cur;
  const head=q.t==='fill'?'Completa la oración':q.q;
  shell(`<div class="q"><div class="tg">${QLABEL[q.t]}${q.miss?' · repaso':''} ${speakBtn(q.t==='fill'?q.q.replace(/\{\}/g,'…'):(q.sc?q.sc+'. ':'')+q.q)}</div>${q.sc?`<div class="sc" style="margin-top:8px">${q.sc}</div>`:''}<h2>${head}</h2><div id="qb"></div>${SAMPLE&&q.t!=='mat'?`<button class="hintbtn" id="hb">${ic('bulb')} Pista con IA</button><div id="hx"></div>`:''}</div>`,
    `<div class="fb"></div><button class="btn" id="ck" disabled>Comprobar</button>`);
  const ck=$('#ck');
  ctl=MOUNT[q.t](q,$('#qb'),()=>{ck.disabled=!ctl.ready()},ok=>feedback(ok,ctl.right));
  ck.onclick=()=>{if(ck.disabled)return;const r=ctl.check();feedback(r.ok,r.right)};
  const f=$('#qb input');f&&f.focus();
  const hb=$('#hb');if(hb)hb.onclick=aiHint;
}
async function aiHint(){
  const hb=$('#hb'),hx=$('#hx');if(!hb||run.hintUsed||!SAMPLE)return;run.hintUsed=true;hb.disabled=true;hx.className='hintbox';hx.textContent='Pensando…';
  const q=run.cur;let t=plain(q.q);if(q.sc)t=plain(q.sc)+' '+t;
  if(q.o)t+=' Opciones: '+q.o.map(plain).join(' | ');if(q.items)t+=' Elementos: '+q.items.map(plain).join(' | ');
  try{const r=await SAMPLE('Eres un tutor de ingeniería automotriz. Da una pista breve (máximo 40 palabras, en español) para ayudar a resolver esta pregunta SIN revelar la respuesta ni decir cuál opción es. Pregunta: '+t.slice(0,900),{cache:false,modelTier:'quick',onText:({text})=>{hx.textContent=text}});hx.textContent=r.text}
  catch(e){hx.textContent=e&&e.code==='rate_limited'?'Demasiadas pistas seguidas. Prueba en un rato.':'La pista no está disponible ahora.'}
}
function feedback(ok,right){
  if(run.over||$('#lf.good,#lf.bad'))return;
  const q=run.cur,lf=$('#lf'),ck=$('#ck');
  S.st.answered++;
  if(ok){S.st.correct++;qprog('correct');run.correct++;run.combo++;if(!q.miss)run.first++;
    if(run.combo>run.best){run.best=run.combo;S.st.bestCombo=Math.max(S.st.bestCombo,run.combo)}
    if(run.combo===5)qprog('combo5');
    if(run.mode==='mistakes'&&q.id&&S.mistakes[q.id]){delete S.mistakes[q.id];S.st.fixed++}
    beep('ok')}
  else{q.miss=true;run.wrong++;run.hearts--;run.combo=0;run.queue.push(q);if(q.id)S.mistakes[q.id]=1;
    const m=$('.q');m&&m.classList.add('shake');beep('no')}
  save();
  const fs=LS.querySelectorAll('.fuel span');fs.forEach((h,i)=>h.classList.toggle('gone',i>=run.hearts));
  const cb=$('#cb');if(cb)cb.innerHTML=run.combo>=2?ic('flame','fill')+run.combo:'';
  const pct=Math.round(run.correct/run.total*100);$('.pbar i').style.width=pct+'%';$('.carx').style.left=pct+'%';
  lf.classList.add(ok?'good':'bad');
  const good=run.combo>=5?'¡Racha de '+run.combo+'!':['¡Correcto!','¡Así se hace!','¡Exacto!','¡Muy bien!'][run.correct%4];
  $('.fb').innerHTML=`<b>${ok?ic('check')+good:ic('close')+'Casi'}</b><p>${ok?'':`<strong>Respuesta: ${right}.</strong> `}${q.e||''}</p>`;
  ck.disabled=false;ck.textContent='Continuar';ck.style.setProperty('--c',ok?'var(--good)':'var(--bad)');
  ck.onclick=()=>{if(run.hearts<=0)fail();else nextQ()};ck.focus();
}
function fail(){
  run.over=true;
  shell(`<div class="done-s"><div class="big" style="color:var(--bad)">${ic('fuel')}</div><h2>Sin combustible</h2><p>Se acabaron los intentos. Repasa la teoría y vuelve a probar: así se aprende.</p></div>`,
    `<button class="btn ghost" id="b1">Salir</button><span style="flex:1"></span>${run.pages.length&&run.mode!=='test'?'<button class="btn ghost" id="b3">Ver teoría</button>':''}<button class="btn" id="b2">Reintentar</button>`,{noHud:true});
  const o=run;$('#b1').onclick=closeRun;
  $('#b2').onclick=()=>{const r=o;closeRun();if(r.mode==='lesson')runLesson(r.ui,r.li);else if(r.mode==='test')runTest(r.ui);else if(r.mode==='daily')runDaily();else runPractice(r.mode)};
  const b3=$('#b3');if(b3)b3.onclick=()=>{const r=o;closeRun();runTheory(r.ui,r.li)};
}
function finish(){
  run.over=true;const m=run.mode,perfect=run.wrong===0,st=perfect?3:run.wrong<=2?2:1;
  let xp=0,coins=0,again=false,note='';
  if(m==='lesson'){again=!!S.done[run.id];xp=10+run.first*2+(perfect?5:0);coins=3+(perfect?2:0);
    if(again)xp=Math.round(xp/2),coins=0;
    const prev=starsOf(S.done[run.id]);S.done[run.id]=Math.max(prev,st);
    if(!again)S.st.lessons++;qprog('lessons');if(perfect){S.st.perfect++;qprog('perfect')}
    const u=UNITS[run.ui];if(!again&&run.li===u.lessons.length-1)note='Abriste el examen de la unidad.';}
  else if(m==='test'){again=!!S.tests[run.id];xp=25+run.first*3+(perfect?10:0);coins=8;
    if(again)xp=Math.round(xp/2),coins=0;
    const prev=starsOf(S.tests[run.id]);S.tests[run.id]=Math.max(prev,st);
    if(!again)S.st.tests++;if(st===3&&prev<3)S.st.tests3++}
  else if(m==='daily'){const first=!S.daily[dk()];S.daily[dk()]=1;xp=first?25:8;coins=first?15:0;if(first){S.st.dailyDone++;qprog('daily')}}
  else{xp=run.first*2;coins=run.mode==='mistakes'?run.first:0}
  const lvB=lvlOf(S.xp),pB=lvlProg(S.xp);
  if(xp>0)addXP(xp);addCoins(coins);checkBadges();save();
  const pA=lvlProg(S.xp),acc=Math.round(run.first/run.total*100);
  if(st===3&&(m==='lesson'||m==='test')||m==='daily'){beep('lvl');confetti(100)}else beep('done');
  const big={lesson:'flag',test:'trophy',daily:'target',mistakes:'wrench',mixed:'check'}[m];
  const ttl={lesson:'Lección completada',test:'Examen superado',daily:'Desafío completado',mistakes:'Errores repasados',mixed:'Práctica terminada'}[m];
  shell(`<div class="done-s"><div class="big">${ic(big)}</div><h2>${ttl}</h2><p>${note||esc(run.sub)}</p>${m==='lesson'||m==='test'?`<div class="starbig">${starsHTML(st)}</div>`:''}
    <div class="tiles"><div class="tile" style="--tc:var(--gold)"><b>XP</b><span>${ic('bolt','fill')}${xp}</span></div><div class="tile" style="--tc:${run.color}"><b>Precisión</b><span>${acc}%</span></div><div class="tile" style="--tc:var(--flame)"><b>Mejor racha</b><span>${ic('flame','fill')}${run.best}</span></div></div>
    <div class="card" style="text-align:left"><div class="mono">NIVEL ${pA.n} · ${esc(rankTitle(pA.n))}</div><div class="bar"><i style="width:${lvB<pA.n?100:pA.pct}%"></i></div><div class="mono">${pA.cur} / ${pA.need} XP${coins?` · +${coins} tuercas`:''}</div></div></div>`,
    `<span style="flex:1"></span><button class="btn" id="b1">Continuar</button>`,{noHud:true});
  $('#b1').onclick=closeRun;
}
document.addEventListener('keydown',e=>{
  if(LS.hidden||!run||!$('#modal').hidden)return;
  if(e.key==='Enter'){const b=$('#ck')||$('#nx')||$('#b1');if(b&&!b.disabled&&document.activeElement!==b){e.preventDefault();b.click()}}
  else if(ctl&&ctl.key&&!$('#lf.good,#lf.bad')&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName))ctl.key(e.key);
});
LS.addEventListener('click',e=>{const s=e.target.closest('[data-say]');if(s)say(s.dataset.say.replace(/&amp;/g,'&'))});

/* ---------- tipos de ejercicio ---------- */
const MOUNT={
  mc(q,root,chg){
    const o=shuffle(q.o.map((t,i)=>({t,ok:i===q.a})));let sel=-1,lock=false;
    root.innerHTML=`<div class="opts">${o.map((x,i)=>`<button class="opt"><kbd>${i+1}</kbd><span>${x.t}</span></button>`).join('')}</div>`;
    const b=$$('.opt',root);
    b.forEach((x,i)=>x.onclick=()=>{if(lock)return;sel=i;b.forEach((y,j)=>y.classList.toggle('sel',j===i));chg()});
    const right=o.find(x=>x.ok).t;
    return{right,ready:()=>sel>=0,key:k=>{if(b[k-1])b[k-1].click()},
      check(){lock=true;b.forEach((x,i)=>{x.disabled=true;x.classList.remove('sel');if(o[i].ok)x.classList.add('ok');else if(i===sel)x.classList.add('no')});return{ok:o[sel].ok,right}}};
  },
  tf(q,root,chg){
    let sel=null,lock=false;
    root.innerHTML='<div class="opts tfrow"><button class="opt">Verdadero</button><button class="opt">Falso</button></div>';
    const b=$$('.opt',root);
    b.forEach((x,i)=>x.onclick=()=>{if(lock)return;sel=i===0;b.forEach((y,j)=>y.classList.toggle('sel',j===i));chg()});
    const right=q.a?'Verdadero':'Falso';
    return{right,ready:()=>sel!==null,key:k=>{if(k==='1'||/^v$/i.test(k))b[0].click();if(k==='2'||/^f$/i.test(k))b[1].click()},
      check(){lock=true;const ok=sel===q.a;b.forEach((x,i)=>{x.disabled=true;x.classList.remove('sel');const val=i===0;if(val===q.a)x.classList.add('ok');else if(val===sel)x.classList.add('no')});return{ok,right}}};
  },
  ord(q,root,chg){
    const bank=shuffle(q.items.map((t,i)=>({t,i})));let placed=[],lock=false;
    const draw=()=>{
      root.innerHTML=`<div class="ans" id="an"></div><div class="bank" id="bk"></div>`;
      placed.forEach((p,k)=>{const c=document.createElement('button');c.className='chip ordn';c.innerHTML=`<i>${k+1}</i>${p.t}`;c.onclick=()=>{if(lock)return;placed.splice(k,1);draw();chg()};$('#an',root).appendChild(c)});
      bank.forEach(p=>{const used=placed.includes(p),c=document.createElement('button');c.className='chip'+(used?' used':'');c.innerHTML=p.t;c.disabled=used;c.onclick=()=>{if(lock)return;placed.push(p);draw();chg()};$('#bk',root).appendChild(c)});
    };draw();
    const right=q.items.map((t,i)=>`${i+1}. ${t}`).join(' → ');
    return{right,ready:()=>placed.length===bank.length,check(){lock=true;const ok=placed.every((p,k)=>p.i===k);$$('.ans .chip',root).forEach((c,k)=>c.style.borderColor=placed[k].i===k?'var(--good)':'var(--bad)');return{ok,right}}};
  },
  mat(q,root,chg,fin){
    const L=shuffle(q.pairs.map((p,i)=>({t:p[0],i}))),R=shuffle(q.pairs.map((p,i)=>({t:p[1],i})));
    let sl=null,sr=null,done=new Set(),mist=false,finished=false;
    root.innerHTML=`<div class="mt"><div style="display:grid;gap:12px;align-content:start" id="ml"></div><div style="display:grid;gap:12px;align-content:start" id="mr"></div></div>`;
    const mk=(arr,host,side)=>arr.map(p=>{const b=document.createElement('button');b.innerHTML=p.t;b.onclick=()=>{if(done.has(p.i))return;if(side==='l')sl=sl===p?null:p;else sr=sr===p?null:p;paint();try1()};host.appendChild(b);return b});
    const bl=mk(L,$('#ml',root),'l'),br=mk(R,$('#mr',root),'r');
    function paint(){bl.forEach((b,k)=>{b.classList.toggle('sel',sl===L[k]);b.classList.toggle('ok',done.has(L[k].i))});br.forEach((b,k)=>{b.classList.toggle('sel',sr===R[k]);b.classList.toggle('ok',done.has(R[k].i))})}
    function try1(){
      if(!sl||!sr)return;
      if(sl.i===sr.i){done.add(sl.i);sl=sr=null;paint();if(done.size===q.pairs.length&&!finished){finished=true;fin(!mist)}}
      else{mist=true;const a=bl[L.indexOf(sl)],b=br[R.indexOf(sr)];a.classList.add('no');b.classList.add('no');sl=sr=null;setTimeout(()=>{a.classList.remove('no','sel');b.classList.remove('no','sel');paint()},550)}
    }
    return{right:q.pairs.map(p=>p[0]+' = '+p[1]).join('; '),ready:()=>false,check(){return{ok:true,right:''}}};
  },
  num(q,root,chg){
    root.innerHTML=`<div class="numrow"><input id="ni" inputmode="decimal" autocomplete="off" aria-label="Respuesta"><span>${q.unit||''}</span></div><p class="mono" style="margin-top:10px">Usa punto o coma para los decimales.</p>`;
    const inp=$('#ni',root);const val=()=>{const s=inp.value.trim().replace(',','.');return s!==''&&isFinite(s)?parseFloat(s):null};
    inp.oninput=chg;const tol=q.tol!=null?q.tol:Math.abs(q.a)*0.01,right=fmt(q.a)+(q.unit?' '+q.unit:'');
    return{right,ready:()=>val()!==null,check(){inp.disabled=true;const ok=Math.abs(val()-q.a)<=tol+1e-9;inp.style.borderColor=ok?'var(--good)':'var(--bad)';return{ok,right}}};
  },
  diag(q,root,chg){return MOUNT.mc(q,root,chg)},
  fill(q,root,chg){
    const parts=q.q.split('{}'),n=parts.length-1,bank=shuffle(q.ans.concat(q.extra||[]).map((t,i)=>({t,i})));
    let slots=Array(n).fill(null),lock=false,res=null;
    const draw=()=>{
      let s='';parts.forEach((p,i)=>{s+=p;if(i<n){const b=slots[i];s+=`<span class="blank${res?(res[i]?' ok':' no'):''}" data-i="${i}" role="button" tabindex="0">${b?b.t:'&nbsp;'}</span>`}});
      root.innerHTML=`<div class="fillq">${s}</div><div class="bank">${bank.map((b,k)=>`<button class="chip${slots.includes(b)?' used':''}" data-k="${k}" ${slots.includes(b)||lock?'disabled':''}>${b.t}</button>`).join('')}</div>`;
      $$('.blank',root).forEach(el=>{const clear=()=>{if(lock)return;slots[+el.dataset.i]=null;draw();chg()};el.onclick=clear;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.stopPropagation();e.preventDefault();clear()}}});
      $$('.chip',root).forEach(c=>c.onclick=()=>{if(lock)return;const k=slots.indexOf(null);if(k<0)return;slots[k]=bank[+c.dataset.k];draw();chg()});
    };draw();
    const right=q.ans.join(' / ');
    return{right,ready:()=>slots.every(Boolean),check(){lock=true;res=slots.map((s,i)=>s.t===q.ans[i]);draw();return{ok:res.every(Boolean),right}}};
  }
};
/* ---------- arranque ---------- */
document.addEventListener('click',e=>{if(!$('#onb').hidden&&e.target.closest('#onb'))return onbClick(e);onViewClick(e)});
document.addEventListener('change',onViewChange);
document.addEventListener('input',e=>{
  if(e.target.id==='libq'){LIBQ=e.target.value;libList()}
  else if(e.target.closest&&e.target.closest('.tool'))labInput(e);
});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!==VIEW&&VTITLE[h]){VIEW=h;renderAll()}});
(function boot(){
  load();applyTheme();applyLivery();protectStreak();leagueRoll();checkBadges();save();
  const h=location.hash.slice(1);if(h&&VTITLE[h])VIEW=h;
  renderAll();
  if(!S.profile){OB.step=0;renderOnb()}
  else flush();
  try{if(window.claude&&claude.use)claude.use('sample').then(s=>{SAMPLE=s}).catch(()=>{})}catch(e){}
})();
