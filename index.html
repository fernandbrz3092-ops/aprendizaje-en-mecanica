<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Aprende ingeniería automotriz y motorsport con lecciones, niveles por XP, liga y laboratorio."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%23E5322D%27/%3E%3C/svg%3E"><style>*{box-sizing:border-box}html,body{margin:0}</style></head><body><title>Cilindrada</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout concept: a workshop dashboard. Left rail = paddock nav, centre = hex-nut lesson path on a blueprint grid, right = quests, league and daily challenge. Level shown on a tachometer. Livery (accent) is user-selectable. */
:root{
  --bg:#EBEEF2; --grid:rgba(13,27,42,.05); --surface:#FFFFFF; --surface2:#F4F6F9; --ink:#0D1B2A; --ink2:#51617A; --line:#D3DAE3; --line-d:#BAC5D2;
  --accent:#E5322D; --good:#1C9E5E; --bad:#E5322D; --gold:#F0AA14; --flame:#F2762E; --locked:#DCE2E9; --locked-d:#BFC8D3;
  --f-disp:'Barlow Condensed','Arial Narrow','Roboto Condensed',sans-serif;
  --f-body:'Barlow','Segoe UI',system-ui,-apple-system,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --hh:60px; --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D131A; --grid:rgba(255,255,255,.04); --surface:#17202B; --surface2:#1E2936; --ink:#EAF0F6; --ink2:#9BACBE; --line:#2B3846; --line-d:#3A4A5B;
    --accent:#F0524D; --good:#2BB873; --bad:#F0524D; --gold:#F5B82E; --flame:#F58A45; --locked:#243140; --locked-d:#1A2430; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D131A; --grid:rgba(255,255,255,.04); --surface:#17202B; --surface2:#1E2936; --ink:#EAF0F6; --ink2:#9BACBE; --line:#2B3846; --line-d:#3A4A5B;
  --accent:#F0524D; --good:#2BB873; --bad:#F0524D; --gold:#F5B82E; --flame:#F58A45; --locked:#243140; --locked-d:#1A2430; color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
[hidden]{display:none!important}
body{
  background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px;
  color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.5; margin:0; padding-block:0 40px;
  padding-left:var(--gl); padding-right:var(--gr); -webkit-font-smoothing:antialiased;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg{display:block}
a{color:var(--accent)}
.ico{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ico.fill{fill:currentColor;stroke:none}
.mono{font-family:var(--f-mono);font-size:12px;color:var(--ink2)}
h1,h2,h3{margin:0}

/* shell */
.app{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:228px minmax(0,1fr);gap:28px;align-items:start}
.nav{position:sticky;top:env(safe-area-inset-top,0px);padding:22px 0;display:flex;flex-direction:column;gap:6px;max-height:100vh;overflow:auto}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-disp);font-weight:800;font-size:30px;letter-spacing:.03em;text-transform:uppercase;line-height:1;margin-bottom:18px;padding-left:6px}
.logo svg{width:32px;height:32px}
.nl{display:flex;align-items:center;gap:14px;padding:11px 14px;border:2px solid transparent;border-radius:14px;background:none;text-align:left;font-family:var(--f-disp);font-weight:700;font-size:19px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);position:relative}
.nl .ico{font-size:26px}
.nl:hover{background:var(--surface)}
.nl.on{background:color-mix(in srgb,var(--accent) 12%,var(--surface));border-color:var(--accent);color:var(--accent)}
.nl .dot{position:absolute;right:12px;top:50%;width:10px;height:10px;border-radius:50%;background:var(--bad);transform:translateY(-50%)}
.col{min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;height:var(--hh);display:flex;align-items:center;gap:12px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);margin-top:8px}
.top h1{font-family:var(--f-disp);font-size:30px;text-transform:uppercase;letter-spacing:.03em;font-weight:800;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .mlogo{display:none}
.chips{display:flex;gap:8px;align-items:center}
.cs{display:flex;align-items:center;gap:7px;font-family:var(--f-mono);font-weight:700;font-size:14px;padding:6px 11px;border-radius:12px;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;color:var(--ink)}
.cs .ico{font-size:19px}
.cs.fire{color:var(--flame)}.cs.nut{color:var(--ink)}.cs.nut .ico{color:var(--ink2)}
button.cs{cursor:pointer}
.lvlchip{padding:2px 12px 2px 4px}
.lvlchip svg{width:36px;height:36px}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);gap:0}
  .nav{position:fixed;inset:auto 0 0 0;z-index:40;flex-direction:row;justify-content:space-around;padding:6px var(--gr) calc(6px + env(safe-area-inset-bottom,0px)) var(--gl);background:var(--surface);border-top:2px solid var(--line);max-height:none;gap:0;overflow:visible}
  .nav .logo{display:none}
  .nl{flex-direction:column;gap:2px;padding:6px 4px;font-size:11px;letter-spacing:.04em;flex:1;justify-content:center;align-items:center;border-radius:12px}
  .nl .ico{font-size:24px}
  .nl .dot{right:22%;top:6px;transform:none;width:8px;height:8px}
  body{padding-bottom:92px}
  .top{margin-inline:calc(-1*var(--gl)) calc(-1*var(--gr));padding-inline:var(--gl) var(--gr);top:env(safe-area-inset-top,0px);margin-top:0;background:var(--bg)}
  .top h1{font-size:24px}
  .top .mlogo{display:block;width:28px;height:28px;flex:none}
}
@media (max-width:480px){.cs.nut{display:none}}

/* generic blocks */
.card{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px}
.card+.card,.stack>*+*{margin-top:16px}
.card h3,.sh{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);margin:0 0 10px;font-weight:700}
.card .ct{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.card .ct h3{margin:0}
.card .ct button,.linkbtn{background:none;border:0;color:var(--accent);font-weight:700;font-size:13px;padding:0}
.bar{height:12px;border-radius:99px;background:var(--surface2);border:2px solid var(--line);overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .5s}
.btn{--c:var(--accent);background:var(--c);color:#fff;border:0;border-bottom:4px solid color-mix(in srgb,var(--c) 68%,#000);border-radius:14px;padding:13px 22px;font-family:var(--f-disp);font-weight:800;font-size:19px;letter-spacing:.06em;text-transform:uppercase;line-height:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .06s,border-bottom-width .06s;text-decoration:none}
.btn:active{transform:translateY(2px);border-bottom-width:2px}
.btn[disabled]{background:var(--locked);color:var(--ink2);border-bottom-color:var(--locked-d);cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--ink2);border:2px solid var(--line);border-bottom-width:4px}
.btn.sm{font-size:15px;padding:9px 14px}
.btn.gold{--c:var(--gold);color:#1a1200}
.tag{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:3px 8px;border-radius:8px;background:var(--surface2);color:var(--ink2);border:1.5px solid var(--line)}
.vgrid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.g2,.g3{grid-template-columns:minmax(0,1fr)}}

/* learn */
.vlearn{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:start}
.rcol{position:sticky;top:calc(var(--hh) + env(safe-area-inset-top,0px) + 14px)}
@media (max-width:1120px){.vlearn{grid-template-columns:minmax(0,1fr)}.rcol{position:static}.rcol.dsk{display:none}}
.jh{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.jh .jic{width:56px;height:56px;border-radius:16px;background:var(--c);color:#fff;display:grid;place-items:center;font-size:30px;flex:none;border-bottom:4px solid color-mix(in srgb,var(--c) 68%,#000)}
.jh .tx{flex:1;min-width:180px}
.jh h2{font-family:var(--f-disp);font-size:28px;text-transform:uppercase;line-height:1}
.branch{margin:34px 0 14px;display:flex;align-items:center;gap:14px;color:var(--ink2)}
.branch::before,.branch::after{content:"";height:10px;flex:1;background:repeating-linear-gradient(90deg,var(--line) 0 10px,transparent 10px 20px)}
.branch span{font-family:var(--f-mono);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;text-align:center}
.unit{margin-bottom:44px;scroll-margin-top:calc(var(--hh) + env(safe-area-inset-top,0px) + 12px)}
.banner{position:sticky;top:calc(var(--hh) + env(safe-area-inset-top,0px) + 6px);z-index:10;background:var(--c);color:#fff;border-radius:18px;border-bottom:5px solid color-mix(in srgb,var(--c) 68%,#000);padding:14px 18px 14px 34px;display:flex;align-items:center;gap:14px;overflow:hidden}
.banner::before,.banner::after{content:"";position:absolute;left:11px;width:8px;height:8px;border-radius:50%;background:rgba(0,0,0,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.banner::before{top:12px}.banner::after{bottom:12px}
.banner .tx{min-width:0;flex:1;position:relative;z-index:1}
.banner small{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.9;font-weight:700}
.banner h2{margin:2px 0 0;font-family:var(--f-disp);font-size:30px;line-height:1;text-transform:uppercase;font-weight:800;text-wrap:balance}
.banner p{margin:4px 0 0;font-size:14px;opacity:.93;line-height:1.3}
.banner .gl{position:absolute;right:-10px;top:50%;transform:translateY(-50%) rotate(-12deg);font-size:110px;opacity:.2}
.banner .gl .ico{stroke-width:1.4}
.nodes{display:flex;flex-direction:column;align-items:center;gap:40px;padding:42px 0 6px}
.nw{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;transform:translateX(var(--dx,0px));width:150px}
.nw.open{z-index:25}
.node{position:relative;width:84px;height:94px;border:0;background:none;padding:0;margin-bottom:10px;filter:drop-shadow(0 7px 0 color-mix(in srgb,var(--c) 60%,#000));transition:transform .08s,filter .08s}
.hx{position:absolute;inset:0;background:var(--c);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:grid;place-items:center;color:#fff;font-size:34px}
.hx::before{content:"";position:absolute;width:54px;height:54px;border-radius:50%;border:3px solid rgba(255,255,255,.28);box-shadow:inset 0 0 0 2px rgba(0,0,0,.08)}
.hx .ico{position:relative;z-index:1}
.node:active{transform:translateY(5px);filter:drop-shadow(0 2px 0 color-mix(in srgb,var(--c) 60%,#000))}
.node.lock{filter:drop-shadow(0 7px 0 var(--locked-d))}
.node.lock .hx{background:var(--locked);color:var(--ink2)}
.node.lock .hx::before{border-color:var(--line-d)}
.node.lock:active{transform:none}
.node.test{width:96px;height:106px}.node.test .hx{font-size:38px}
.node.gold .hx{background:var(--gold);color:#241800}
.node.cur::after{content:"";position:absolute;inset:-12px -10px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:color-mix(in srgb,var(--c) 32%,transparent);animation:pulse 1.8s ease-out infinite;z-index:-1}
@keyframes pulse{0%{transform:scale(.92);opacity:1}100%{transform:scale(1.22);opacity:0}}
.go{position:absolute;top:-34px;left:50%;transform:translateX(-50%);background:var(--surface);color:var(--c);border:2px solid var(--line);border-bottom-width:4px;border-radius:10px;padding:2px 10px;font-family:var(--f-disp);font-weight:800;font-size:15px;letter-spacing:.08em;white-space:nowrap;animation:bob 1.2s ease-in-out infinite;pointer-events:none;z-index:2}
.go::after{content:"";position:absolute;left:50%;bottom:-8px;width:10px;height:10px;background:var(--surface);border:2px solid var(--line);border-top:0;border-left:0;transform:translateX(-50%) rotate(45deg)}
@keyframes bob{50%{transform:translate(-50%,-4px)}}
.nm{font-weight:600;font-size:13px;line-height:1.2;text-align:center;color:var(--ink2);text-wrap:balance}
.stars{display:flex;gap:2px;font-size:13px;color:var(--gold);margin-top:3px}
.stars .off{color:var(--line-d)}
.pop{position:absolute;z-index:20;top:calc(100% + 8px);left:50%;transform:translateX(-50%);width:268px;background:var(--c);color:#fff;border-radius:16px;padding:14px;border-bottom:5px solid color-mix(in srgb,var(--c) 68%,#000);text-align:left;box-shadow:0 12px 30px rgba(0,0,0,.25)}
.pop b{display:block;font-family:var(--f-disp);font-size:22px;line-height:1.05;text-transform:uppercase}
.pop p{margin:4px 0 12px;font-size:14px;line-height:1.35;opacity:.95}
.pop .row{display:flex;gap:8px}
.pop .btn{flex:1;--c:#fff;color:color-mix(in srgb,var(--cc) 90%,#000);padding:11px 12px;border-bottom-color:rgba(0,0,0,.22);font-size:16px}
.pop .btn.sec{background:rgba(255,255,255,.18);color:#fff;border-bottom-color:rgba(0,0,0,.2);flex:none}
.pop::before{content:"";position:absolute;left:50%;top:-7px;width:14px;height:14px;background:var(--c);transform:translateX(-50%) rotate(45deg)}

/* journeys */
.jcard{display:flex;flex-direction:column;gap:10px;position:relative}
.jcard .jic{width:52px;height:52px;border-radius:14px;background:var(--c);color:#fff;display:grid;place-items:center;font-size:28px;border-bottom:4px solid color-mix(in srgb,var(--c) 68%,#000)}
.jcard h3{font-family:var(--f-disp);font-size:24px;text-transform:uppercase;letter-spacing:.02em;color:var(--ink);margin:0}
.jcard p{margin:0;color:var(--ink2);font-size:14.5px}
.jcard.act{border-color:var(--c)}
.jcard .pill{position:absolute;right:14px;top:14px}
.us{display:flex;flex-wrap:wrap;gap:6px}

/* side cards */
.dc{background:var(--accent);color:#fff;border-radius:18px;padding:16px;border-bottom:5px solid color-mix(in srgb,var(--accent) 68%,#000);position:relative;overflow:hidden}
.dc::after{content:"";position:absolute;right:0;top:0;bottom:0;width:22px;background:repeating-conic-gradient(rgba(255,255,255,.9) 0 25%,rgba(0,0,0,.2) 0 50%) 0 0/11px 11px}
.dc h3{color:rgba(255,255,255,.9)}
.dc b{display:block;font-family:var(--f-disp);font-size:26px;text-transform:uppercase;line-height:1;margin-bottom:6px;padding-right:20px}
.dc p{margin:0 0 12px;font-size:14px;padding-right:20px;opacity:.95}
.dc .btn{--c:#fff;color:color-mix(in srgb,var(--accent) 88%,#000);border-bottom-color:rgba(0,0,0,.25);font-size:16px;padding:10px 16px}
.dc.done{background:var(--good);border-bottom-color:color-mix(in srgb,var(--good) 68%,#000)}
.dc.done .btn{color:color-mix(in srgb,var(--good) 88%,#000)}
.q-row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:10px 0;border-top:2px solid var(--line)}
.q-row:first-of-type{border-top:0}
.q-row b{font-weight:600;font-size:15px;line-height:1.25}
.q-row .bar{grid-column:1/-1;margin:2px 0 0;height:10px}
.q-row .bar i{background:var(--good)}
.q-row .rw{font-family:var(--f-mono);font-size:12px;color:var(--ink2);display:flex;gap:8px;align-items:center}
.q-row .btn{font-size:14px;padding:7px 12px}
.week{display:flex;gap:6px;margin-top:8px}
.week span{flex:1;text-align:center;font-family:var(--f-mono);font-size:11px;color:var(--ink2)}
.week i{display:grid;place-items:center;height:30px;border-radius:9px;background:var(--surface2);border:2px solid var(--line);margin-bottom:4px;color:#fff;font-size:16px}
.week .on i{background:var(--flame);border-color:var(--flame)}
.week .fz i{background:#3AA7E0;border-color:#3AA7E0}
.week .td i{border-color:var(--ink2)}

/* league */
.lhead{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.tier{width:74px;height:82px;display:grid;place-items:center;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--c);color:#fff;font-size:34px}
.lr{display:grid;grid-template-columns:34px 44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 12px;border-radius:14px;border:2px solid transparent}
.lr+.lr{margin-top:2px}
.lr .rk{font-family:var(--f-mono);font-weight:700;text-align:center;color:var(--ink2)}
.lr .nmx{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr .xpx{font-family:var(--f-mono);font-weight:700;font-size:14px}
.lr.me{background:color-mix(in srgb,var(--accent) 12%,var(--surface));border-color:var(--accent)}
.zone{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:8px 12px;margin:6px 0;border-radius:10px}
.zone.up{color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}
.zone.dn{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.av{display:block;border-radius:50%;overflow:hidden;flex:none}

/* lab */
.tool h3{font-family:var(--f-disp);font-size:24px;text-transform:uppercase;letter-spacing:.02em;color:var(--ink);margin:0 0 2px}
.tool>p{margin:0 0 12px;color:var(--ink2);font-size:14.5px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.fld label{display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin-bottom:3px}
.fld input,.fld select,.inp{width:100%;font-family:var(--f-mono);font-size:16px;font-weight:700;padding:9px 10px;border-radius:12px;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);min-width:0}
.fld input:focus,.inp:focus{outline:none;border-color:var(--accent)}
.outs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.out{background:var(--surface2);border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.out small{display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.out b{font-family:var(--f-mono);font-size:22px;line-height:1.2}
.out b em{font-style:normal;font-size:13px;color:var(--ink2);margin-left:3px}
.out.hi{border-color:var(--accent)}
.note{margin-top:10px;font-size:14px;color:var(--ink2)}
.rng{width:100%;accent-color:var(--accent)}

/* library */
.srch{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.srch .inp{flex:1;min-width:200px;font-family:var(--f-body);font-weight:500}
.chipsel{display:flex;gap:6px;flex-wrap:wrap}
.cf{border:2px solid var(--line);border-bottom-width:3px;background:var(--surface);border-radius:999px;padding:5px 13px;font-size:14px;font-weight:600}
.cf.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.term b{font-family:var(--f-disp);font-size:22px;text-transform:uppercase;letter-spacing:.02em}

function figStrokes(){
  const names=['1 · Admisión','2 · Compresión','3 · Combustión','4 · Escape'];
  const py=[84,84,44,44], dirs=['down','up','down','up'], gas=[.14,.3,.6,.1];

  names.forEach((n,i)=>{
    const ox=i*118+10, top=28;
    s+=`<rect x="${ox+20}" y="${top}" width="62" height="${py[i]-top}" class="f" opacity="${gas[i]}"/>`;
    s+=`<path class="s" d="M${ox+18} ${top}V124M${ox+84} ${top}V124M${ox+18} ${top}H${ox+84}"/>`;
    const io=i===0?7:0, eo=i===3?7:0;
    s+=`<path class="s" d="M${ox+38} ${top+io}V${top-14}M${ox+33} ${top+io}h10"/>`;
    s+=`<path class="s" d="M${ox+64} ${top+eo}V${top-14}M${ox+59} ${top+eo}h10"/>`;
    if(i===2)s+=`<path class="c" d="M${ox+51} ${top}l-4 8 8 0-4 8"/>`;
    s+=`<rect x="${ox+20}" y="${py[i]}" width="62" height="15" rx="2" class="s" style="fill:var(--surface)"/>`;
    s+=`<path class="s" d="M${ox+51} ${py[i]+15}L${ox+51} 150"/><circle cx="${ox+51}" cy="158" r="9" class="s"/>`;
    const a=dirs[i]==='down'?`M${ox+98} 60v36m-5-8l5 8 5-8`:`M${ox+98} 96v-36m-5 8l5-8 5 8`;
    s+=`<path class="c" d="${a}"/>`;
    s+=`<text x="${ox+51}" y="190" text-anchor="middle">${n}</text>`;
  });
  return fig(s+'</svg>','Las válvulas de la izquierda (admisión) y de la derecha (escape) se abren solo en los tiempos 1 y 4.');
}
function figOtto(){
  const X=v=>40+v/9*300, Y=p=>190-p/60*170;
  const pts=(a,b,fn)=>{let d='';for(let i=0;i<=24;i++){const v=a+(b-a)*i/24;d+=(i?'L':'M')+f1(X(v))+' '+f1(Y(fn(v)))}return d};
  const comp=pts(8,1,v=>Math.pow(8/v,1.4)), exp=pts(1,8,v=>55*Math.pow(1/v,1.4));
  let s='<svg viewBox="0 0 380 225" role="img" aria-label="Diagrama presión-volumen del ciclo Otto">';
  s+=`<path class="s" d="M40 20V190H345"/><text x="8" y="16">P</text><text x="338" y="208">V</text>`;
  s+=`<path class="c" d="${comp}"/><path class="c" d="M${X(1)} ${Y(18.4)}V${Y(55)}"/><path class="c" d="${exp}"/><path class="c" d="M${X(8)} ${Y(3)}V${Y(1)}"/>`;
  [[8,1,'1',12,14],[1,18.4,'2',-16,6],[1,55,'3',-16,4],[8,3,'4',10,-4]].forEach(p=>{s+=`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="4" class="f"/><text x="${X(p[0])+p[3]}" y="${Y(p[1])+p[4]}" font-weight="700">${p[2]}</text>`});
  s+=`<text x="215" y="44">1→2 compresión</text><text x="215" y="60">2→3 aporte de calor</text><text x="215" y="76">3→4 expansión</text><text x="215" y="92">4→1 rechazo de calor</text>`;
  return fig(s+'</svg>','Ciclo Otto ideal: el área encerrada es el trabajo neto por ciclo. Aquí r = 8.');
}
function figCurve(){
  const T=r=>110+300*Math.exp(-Math.pow((r-4300)/2500,2));          // Nm
  const P=r=>T(r)*r*2*Math.PI/60/1000;                                // kW
  const X=r=>44+r/8000*300; let tp='',pp='',tm=[0,0],pm=[0,0];
  for(let r=1000;r<=7500;r+=250){const x=f1(X(r)),yt=f1(180-T(r)/450*150),yp=f1(180-P(r)/260*150);tp+=(tp?'L':'M')+x+' '+yt;pp+=(pp?'L':'M')+x+' '+yp;if(T(r)>T(tm[0]||1000))tm=[r,yt];if(P(r)>P(pm[0]||1000))pm=[r,yp]}
  let s='<svg viewBox="0 0 390 225" role="img" aria-label="Curvas de par y potencia de un motor">';
  s+=`<path class="s" d="M44 20V180H350"/>`;
  [0,2000,4000,6000,8000].forEach(r=>{s+=`<path class="l" d="M${X(r)} 180V176"/><text x="${X(r)}" y="196" text-anchor="middle">${r}</text>`});
  s+=`<text x="347" y="212" text-anchor="end">rpm</text><path class="c" d="${tp}"/><path style="stroke:var(--ink);stroke-width:3;fill:none;stroke-dasharray:6 4" d="${pp}"/>`;
  s+=`<circle cx="${X(tm[0])}" cy="${tm[1]}" r="4" class="f"/><circle cx="${X(pm[0])}" cy="${pm[1]}" r="4" style="fill:var(--ink)"/>`;
  s+=`<path class="c" d="M54 10h26"/><text x="86" y="14">par (N·m), máx. ≈ ${Math.round(tm[0]/100)*100} rpm</text><path style="stroke:var(--ink);stroke-width:3;stroke-dasharray:6 4" d="M54 26h26"/><text x="86" y="30">potencia (kW), máx. ≈ ${Math.round(pm[0]/100)*100} rpm</text>`;
  return fig(s+'</svg>','Línea continua: par. Línea punteada: potencia. La potencia máxima llega a más rpm que el par máximo.');
}
function figCamber(){
  let s='<svg viewBox="0 0 450 170" role="img" aria-label="Camber positivo, cero y negativo">';
  [['Positivo',-8],['Cero',0],['Negativo',8]].forEach((c,i)=>{

}

<p>El <b>centro de gravedad</b> (CG) es el punto donde actúa el peso. Cuanto más bajo, menos se transfiere carga de un lado al otro en las curvas y menos riesgo de vuelco.</p>`,

 num('Un auto de 1.000 kg (N = 9.810 N) con μ = 0,8. ¿Cuál es la fuerza máxima de fricción?',7848,'N',10,'F = μ·N = 0,8 × 9.810 = 7.848 N.'),
 mc('Bajar el centro de gravedad de un auto…',['aumenta la transferencia de carga','reduce la transferencia de carga','no cambia nada','reduce el agarre'],1,'Menor altura, menos momento y menos transferencia.'),
 tf('El coeficiente μ de un neumático depende solo del compuesto de goma.',false,'También depende de la temperatura, la superficie, la carga y la presión.'),
 mc('Si bloqueas las ruedas al frenar, normalmente…',['frena mejor','la fricción cae y la distancia aumenta','el ABS se desactiva','no hay diferencia'],1,'El rozamiento cinético es menor que el estático.'),
 mc('En una curva, la fuerza centrípeta que mantiene al auto girando la aporta principalmente…',['el motor','la fricción de los neumáticos','el diferencial','el peso'],1,'Sin agarre lateral, el coche sigue recto.')
])
]);

U({branch:'Fundamentos',title:'Materiales y elementos de máquina',sub:'De qué está hecho un auto y cómo se une, gira y resiste.',icon:'cube'},[
L('Propiedades de los materiales',
`<p>Para elegir un material se miran varias propiedades a la vez:</p>
<ul><li><b>Resistencia</b>: tensión máxima antes de deformarse o romperse.</li><li><b>Rigidez</b> (módulo de Young, E): cuánto se deforma ante una carga.</li><li><b>Dureza</b>: resistencia a ser rayado o penetrado.</li><li><b>Ductilidad</b>: capacidad de deformarse sin romper.</li><li><b>Fatiga</b>: falla por cargas repetidas, aunque cada una sea baja.</li></ul>
<span class="k">Esfuerzo: σ = F / A &nbsp; (Pa, MPa)</span>
<div class="tw"><table><tr><th>Material</th><th>Densidad (kg/m³)</th><th>E (GPa)</th></tr><tr><td>Acero</td><td>~7.850</td><td>~200</td></tr><tr><td>Aluminio</td><td>~2.700</td><td>~70</td></tr><tr><td>Titanio</td><td>~4.500</td><td>~110</td></tr><tr><td>Fibra de carbono (compuesto)</td><td>~1.600</td><td>depende de la fibra y su dirección</td></tr></table></div>`,
[
 num('Una barra de 100 mm² soporta una carga de tracción de 20.000 N. ¿Qué esfuerzo soporta? (1 N/mm² = 1 MPa)',200,'MPa',1,'σ = F/A = 20.000 / 100 = 200 MPa.'),
 mat('Une cada propiedad con su significado.',[['Rigidez','Poca deformación bajo carga'],['Ductilidad','Se deforma sin romperse'],['Dureza','Resiste el rayado'],['Fatiga','Falla por cargas repetidas']],''),
 mc('El aluminio, comparado con el acero, tiene una densidad aproximada de…',['el doble','la misma','un tercio','un décimo'],2,'~2.700 vs ~7.850 kg/m³.'),
 tf('Un material más resistente siempre es más rígido.',false,'Resistencia y rigidez son propiedades distintas. Los aceros de distinta resistencia tienen casi el mismo E.'),
 mc('El módulo de Young (E) mide…',['la dureza superficial','la rigidez del material','la temperatura de fusión','la densidad'],1,'Relaciona tensión con deformación en el rango elástico.')
]),
L('Metales y compuestos en el auto',
`<p>Cada pieza usa el material que mejor equilibra <b>peso, costo, resistencia y temperatura</b>.</p>
<ul><li><b>Hierro fundido</b>: bloques y discos de freno de calle; barato y amortigua vibraciones.</li><li><b>Aluminio</b>: culatas, bloques livianos, pistones, llantas, carrocerías.</li><li><b>Acero forjado</b>: cigüeñales, bielas, engranajes; muy resistente a fatiga.</li><li><b>Titanio</b>: válvulas, bielas y bulones en alto rendimiento: liviano y fuerte, pero caro.</li><li><b>Fibra de carbono</b> (CFRP): monocascos, alerones y paneles. Es <b>anisótropa</b>: resiste según la dirección de las fibras.</li></ul>
<div class="tip"><b>Tratamientos</b>El temple endurece el acero calentándolo y enfriándolo rápido; el revenido lo hace menos frágil después.</div>`,
[
 mc('¿Qué material es el más común hoy en el monocasco de un auto de F1?',['Hierro fundido','Compuesto de fibra de carbono','Acero inoxidable','Latón'],1,'Combina muy baja masa con gran rigidez.'),
 tf('La fibra de carbono se comporta igual de resistente en cualquier dirección.',false,'Es anisótropa: la dirección de las fibras manda.'),
 mc('Un cigüeñal de alta exigencia suele ser de…',['acero forjado','aluminio fundido','plástico reforzado','magnesio'],0,'Soporta fatiga y torsión de forma muy confiable.'),
 mat('Une la pieza con su material típico.',[['Disco de freno de calle','Hierro fundido'],['Válvula de competición','Titanio'],['Alerón de F1','Fibra de carbono'],['Culata liviana','Aleación de aluminio']],''),
 mc('El revenido, después del temple, sirve para…',['aumentar la dureza al máximo','reducir fragilidad','enfriar la pieza','soldar'],1,'Quita tensiones y ductiliza el acero endurecido.')
]),
L('Tornillos, engranajes y rodamientos',
`<p>Un auto es una gran máquina de uniones y movimientos.</p>
<ul><li><b>Tornillos</b>: se aprietan con una <b>llave dinamométrica</b> a un par exacto. El objetivo es la <b>precarga</b>: el tornillo trabaja como un resorte rígido que mantiene unidas las piezas.</li><li><b>Engranajes</b>: transmiten giro y modifican par y velocidad.</li><li><b>Rodamientos</b>: reducen fricción en ejes (bolas, rodillos, agujas).</li></ul>
<span class="k">Relación = dientes conducida / dientes motriz<br>rpm salida = rpm entrada / relación<br>par salida ≈ par entrada × relación</span>`,
[
 num('Un piñón de 12 dientes mueve una corona de 48 dientes. ¿Cuál es la relación de reducción?',4,':1',0.01,'48 / 12 = 4.'),
 num('Con esa reducción 4:1 y 3.000 rpm de entrada, ¿cuántas rpm salen?',750,'rpm',1,'3.000 / 4 = 750 rpm.'),
 mc('Con una reducción, el par de salida es…',['mayor y las rpm menores','menor y las rpm mayores','igual','cero'],0,'Se intercambia velocidad por par (sin contar pérdidas).'),
 tf('Apretar un tornillo de culata “bien fuerte, a ojo” es la mejor práctica.',false,'Se usa llave dinamométrica y la secuencia del fabricante: un par incorrecto deforma o afloja la unión.'),
 mc('Un rodamiento sirve principalmente para…',['aumentar la fricción','reducir la fricción entre eje y soporte','multiplicar el par','enfriar'],1,'Cambia deslizamiento por rodadura.')
]),
L('Tolerancias, medición y fallas',
`<p>Las piezas nunca son perfectas: se define cuánto error es aceptable. Esa es la <b>tolerancia</b>. En motores se trabaja en <b>centésimas</b> o milésimas de milímetro.</p>
<ul><li><b>Calibre pie de rey</b>: precisión ~0,02 mm. <b>Micrómetro</b>: ~0,01 mm o mejor.</li><li><b>Juego</b>: holgura entre piezas (por ejemplo, el aceite necesita juego en una biela).</li><li><b>Rugosidad</b> (Ra): acabado superficial.</li></ul>
<p>Las fallas más comunes: <b>fatiga</b> (grietas por ciclos repetidos), <b>desgaste</b>, <b>corrosión</b>, <b>fluencia</b> a altas temperaturas y <b>concentradores de tensión</b> (agujeros, esquinas vivas, rayas) donde nace la grieta.</p>`,
[
 mc('¿Qué instrumento mide con más precisión un diámetro de bulón?',['Regla metálica','Micrómetro','Cinta métrica','Escuadra'],1,'~0,01 mm.'),
 mc('Una grieta que crece tras millones de ciclos de carga normal es una falla por…',['fatiga','corrosión','pandeo','dureza'],0,'Fatiga: carga cíclica, incluso por debajo del límite de rotura.'),
 tf('Las esquinas vivas en una pieza reducen la concentración de tensiones.',false,'La aumentan: por eso se redondean los empalmes (radios de acuerdo).'),
 mc('En una biela con cojinete, el juego de aceite sirve para…',['permitir que se forme una película de aceite','poder desarmar más fácil','reducir la masa','aumentar la temperatura'],0,'Sin película de aceite, hay contacto metal-metal.'),
 mat('Une cada falla con su causa.',[['Fatiga','Cargas cíclicas'],['Corrosión','Reacción química con el medio'],['Desgaste','Fricción entre superficies'],['Fluencia','Carga sostenida a alta temperatura']],'')
])
]);
/* ===== RAMA 2 · MOTOR ===== */
U({branch:'El motor',title:'Motor de combustión',sub:'Los cuatro tiempos, el bloque y los números que lo definen.',icon:'piston'},[
L('Los cuatro tiempos',
`<p>El motor de cuatro tiempos completa un ciclo en <b>dos vueltas del cigüeñal</b> (720°) y solo uno de los cuatro tiempos entrega trabajo.</p>
${figStrokes()}
<ol><li><b>Admisión</b>: el pistón baja y entra la mezcla (o aire).</li><li><b>Compresión</b>: sube y comprime; aumenta la presión y temperatura.</li><li><b>Combustión / expansión</b>: la chispa enciende la mezcla y la presión empuja al pistón hacia abajo. Es el tiempo útil.</li><li><b>Escape</b>: el pistón sube y expulsa los gases quemados.</li></ol>
<div class="tip"><b>Dato</b>En un motor de dos tiempos el ciclo se completa en una sola vuelta, pero tiene más pérdidas y emisiones, por eso casi no se usa en autos.</div>`,
[
 ord('Ordena los tiempos de un motor de cuatro tiempos.',['Admisión','Compresión','Combustión (expansión)','Escape'],'Admisión, compresión, combustión y escape.'),
 mc('¿Cuántas vueltas del cigüeñal se necesitan para un ciclo completo en un motor de cuatro tiempos?',['Media','Una','Dos','Cuatro'],2,'Cuatro carreras del pistón = 2 vueltas.'),
 mc('¿En qué tiempo se produce el trabajo útil?',['Admisión','Compresión','Combustión / expansión','Escape'],2,'La presión de la combustión empuja el pistón.'),
 mat('Une cada tiempo con lo que ocurre.',[['Admisión','Entra aire o mezcla'],['Compresión','Sube la presión y la temperatura'],['Expansión','Los gases empujan al pistón'],['Escape','Salen los gases quemados']],''),
 tf('Durante el tiempo de escape la válvula de admisión permanece abierta del todo.',false,'En el escape se abre la válvula de escape. Solo hay un breve cruce al final.')
]),
L('Las piezas del motor',
`<p>Un motor alternativo transforma el movimiento lineal del pistón en giro continuo.</p>
<ul><li><b>Bloque</b>: contiene los cilindros y soporta casi todo.</li><li><b>Culata</b>: cierra el cilindro por arriba; aloja válvulas, bujías o inyectores.</li><li><b>Junta de culata</b>: sella entre bloque y culata; se daña con sobrecalentamiento.</li><li><b>Pistón y aros</b>: sellan la compresión y controlan el aceite.</li><li><b>Biela</b>: une pistón y cigüeñal.</li><li><b>Cigüeñal</b>: convierte vaivén en giro.</li><li><b>Volante de inercia</b>: almacena energía y suaviza los pulsos.</li><li><b>Cárter</b>: depósito de aceite inferior.</li></ul>`,
[
 mat('Une cada pieza con su función.',[['Cigüeñal','Convierte vaivén en giro'],['Biela','Une pistón y cigüeñal'],['Aros','Sellan la compresión'],['Volante de inercia','Suaviza los pulsos del motor']],''),
 mc('¿Qué pieza cierra el cilindro por arriba y aloja las válvulas?',['Cárter','Culata','Bloque','Volante'],1,'La culata.'),
 mc('Un sobrecalentamiento severo suele dañar primero…',['la junta de culata','el filtro de aire','el escape','la batería'],0,'Puede deformarla o quemarla y mezclar aceite con refrigerante.'),
 tf('El cárter es la pieza donde se almacena el aceite en la mayoría de los motores.',true,'Aunque en competición suele usarse cárter seco con depósito aparte.'),
 mc('El pistón recibe la fuerza de la combustión y la transmite a través de…',['el árbol de levas','la biela','el radiador','la bomba de agua'],1,'Pistón → biela → cigüeñal.')
]),
L('Cilindrada y relación de compresión',
`<p>La <b>cilindrada</b> es el volumen total desplazado por los pistones. La <b>relación de compresión</b> compara el volumen máximo con el mínimo.</p>
<span class="k">V₁ = π/4 · D² · S &nbsp;(por cilindro)<br>Cilindrada = V₁ · n° de cilindros<br>r = (Vd + Vc) / Vc</span>
<p>D = diámetro (<i>bore</i>), S = carrera (<i>stroke</i>), Vd = volumen desplazado, Vc = volumen de la cámara de combustión. Si D &gt; S el motor es de <b>carrera corta</b>: más fácil de girar alto.</p>`,
[
 num('Un cilindro con diámetro 86 mm y carrera 86 mm; el motor tiene 4 cilindros. ¿Cuál es la cilindrada total en cm³?',1998,'cm³',12,'π/4 · 86² · 86 ≈ 499,6 cm³ por cilindro; × 4 ≈ 1.998 cm³.'),
 num('Un cilindro desplaza 450 cm³ y la cámara de combustión mide 45 cm³. ¿Cuál es la relación de compresión?',11,':1',0.05,'r = (450 + 45) / 45 = 11.'),
 mc('Un motor con diámetro mayor que la carrera (D > S) se llama…',['de carrera larga','de carrera corta','diésel','de dos tiempos'],1,'La carrera corta reduce la velocidad media del pistón a las mismas rpm.'),
 mc('Subir la relación de compresión, en general…',['mejora el rendimiento pero exige más octanaje','baja el rendimiento y el octanaje','solo afecta al diésel','no afecta nada'],0,'Más compresión da más eficiencia pero aumenta el riesgo de detonación.'),
 tf('La cilindrada incluye el volumen de la cámara de combustión.',false,'La cilindrada es solo el volumen desplazado por el pistón.')
]),
L('Otto frente a Diésel',
`<p>Ambos son motores de combustión interna de cuatro tiempos, pero encienden la mezcla de forma distinta.</p>
<div class="tw"><table><tr><th></th><th>Otto (nafta)</th><th>Diésel</th></tr><tr><td>Encendido</td><td>Chispa de bujía</td><td>Autoencendido por compresión</td></tr><tr><td>Combustible</td><td>Octanaje (RON)</td><td>Cetanaje</td></tr><tr><td>Relación de compresión típica</td><td>8–13:1</td><td>14–22:1</td></tr><tr><td>Rasgo</td><td>Gira más alto</td><td>Mucho par a bajas rpm, mejor consumo</td></tr></table></div>
${figOtto()}
<p>El diagrama P–V muestra el <b>ciclo Otto ideal</b>: compresión, aporte de calor casi a volumen constante, expansión y rechazo de calor.</p>`,
[
 mc('¿Cómo se enciende la mezcla en un diésel?',['Con bujías','Por la alta temperatura del aire comprimido','Con una bobina','Con un turbo'],1,'El aire comprimido se calienta y enciende el combustible inyectado.'),
 mc('¿Qué propiedad del combustible mide la resistencia a detonar en un motor Otto?',['Cetanaje','Octanaje','Viscosidad','Densidad'],1,'RON/MON.'),
 tf('Un diésel suele tener una relación de compresión mayor que un nafta.',true,'Del orden de 14–22:1.'),
 mat('Une el motor con su rasgo.',[['Otto','Encendido por chispa'],['Diésel','Autoencendido por compresión'],['Ciclo Otto','Calor a volumen casi constante'],['Cetano','Calidad de encendido del gasoil']],''),
 mc('En el diagrama P–V del ciclo Otto, el área encerrada representa…',['el combustible usado','el trabajo neto por ciclo','la temperatura','la fricción'],1,'Es el trabajo neto que entrega el ciclo.')
]),
L('Configuraciones de motor',
`<p>La disposición de cilindros cambia el tamaño, el balance y el sonido del motor.</p>
<ul><li><b>En línea (L4, L6)</b>: simple, ancho a lo largo.</li><li><b>En V (V6, V8, V10, V12)</b>: compacto y rígido; muy usado en competición.</li><li><b>Bóxer (cilindros opuestos)</b>: bajo centro de gravedad y buen balance.</li><li><b>Rotativo (Wankel)</b>: poco común.</li></ul>
<p>La <b>secuencia de encendido</b> reparte las explosiones para suavizar el motor. Más cilindros suelen dar funcionamiento más suave y más rpm posibles, pero más fricción y complejidad.</p>
<div class="tip"><b>En pista</b>Los motores actuales de F1 son V6 de 1,6 litros turbo con sistema híbrido. En el WEC y GT3 es frecuente ver V8, V6 turbo y bóxer.</div>`,
[
 mat('Une la configuración con su rasgo.',[['Bóxer','Cilindros opuestos, bajo CG'],['En V','Compacto y rígido'],['En línea','Cilindros alineados en un solo plano'],['Wankel','Rotor triangular']],''),
 mc('¿Qué configuración usa la F1 actual?',['V6 turbo híbrido','V10 atmosférico','L4 diésel','W16'],0,'V6 de 1,6 litros turbo con sistema de recuperación de energía.'),
 tf('Un motor bóxer tiende a tener un centro de gravedad más bajo que un V del mismo tamaño.',true,'Los cilindros opuestos y planos bajan la altura del conjunto.'),
 mc('La secuencia de encendido sirve para…',['reducir el octanaje','repartir las explosiones y suavizar el funcionamiento','enfriar el motor','aumentar la cilindrada'],1,'Evita vibraciones y reparte las cargas.'),
 mc('Más cilindros, a igual cilindrada total, suelen dar…',['más suavidad y capacidad de girar alto','menos fricción','menor costo','menos piezas'],0,'A costa de más fricción y complejidad.')
])
]);

U({branch:'El motor',title:'Sistemas del motor',sub:'Distribución, lubricación, refrigeración, admisión e inyección.',icon:'gear'},[
L('Distribución y válvulas',
`<p>Las <b>válvulas</b> abren y cierran los conductos de admisión y escape. Las mueve el <b>árbol de levas</b>, accionado por cadena, correa o engranajes desde el cigüeñal.</p>
<ul><li>En un 4T el árbol de levas gira a <b>la mitad</b> de velocidad que el cigüeñal (relación 2:1).</li><li><b>SOHC</b>: un árbol por bancada. <b>DOHC</b>: dos, uno de admisión y otro de escape.</li><li>El <b>cruce de válvulas</b> es el instante en que ambas están abiertas; mejora el llenado a altas rpm.</li><li>El <b>juego de válvulas</b> se controla para que cierren completamente en caliente.</li></ul>
<div class="tip"><b>Si salta la correa</b>En muchos motores las válvulas pueden golpear los pistones (motor “de interferencia”) y se produce una avería grave.</div>`,
[
 num('Un cigüeñal gira a 6.000 rpm. ¿A cuántas rpm gira el árbol de levas en un motor de cuatro tiempos?',3000,'rpm',1,'Relación 2:1.'),
 mc('DOHC significa…',['un árbol de levas en total','dos árboles de levas por bancada','dos válvulas por cilindro','dos bujías'],1,'Double Overhead Camshaft.'),
 tf('Si la correa de distribución se rompe, nunca puede dañarse el motor.',false,'En motores de interferencia, las válvulas golpean los pistones.'),
 mc('El cruce de válvulas es…',['cuando ambas válvulas están cerradas','cuando admisión y escape están abiertas a la vez','el cambio de aceite','un tipo de turbo'],1,'Ayuda al barrido de gases a altas rpm.'),
 mat('Une el componente con su función.',[['Árbol de levas','Abre las válvulas'],['Correa o cadena','Sincroniza cigüeñal y levas'],['Resorte de válvula','Cierra la válvula'],['Taqué','Transmite el movimiento de la leva']],'')
]),
L('Lubricación',
`<p>El aceite evita el contacto metal con metal. Cumple varias funciones: <b>lubricar, refrigerar, limpiar, sellar y proteger</b> de la corrosión.</p>
<ul><li>Una <b>bomba de aceite</b> lo envía a presión por conductos al cigüeñal, bielas, levas y turbo.</li><li><b>SAE 5W-30</b>: el primer número (con W de <i>winter</i>) indica la viscosidad en frío; el segundo, en caliente.</li><li>En competición se usa <b>cárter seco</b>: un depósito externo y varias bombas. Evita que la succión quede en vacío en curvas y frenadas fuertes, y permite montar el motor más bajo.</li></ul>`,
[
 mc('En un aceite 5W-30, ¿qué indica el “5W”?',['La viscosidad en frío','La presión de la bomba','La cantidad de aditivos','El peso del aceite'],0,'W de winter: a menor número, más fluido en frío.'),
 mc('¿Para qué se usa el cárter seco en competición?',['Para ahorrar aceite','Para evitar que se corte la succión de aceite con las fuerzas laterales y bajar el motor','Para enfriar el escape','Para aumentar la cilindrada'],1,'El aceite se almacena en un depósito aparte.'),
 tf('El aceite también ayuda a refrigerar el motor.',true,'Se lleva calor lejos de pistones, cojinetes y turbo.'),
 mc('Una luz de baja presión de aceite encendida a motor caliente debe tratarse como…',['un aviso menor','una emergencia: se detiene el motor','algo que solo pasa en invierno','un error del tablero'],1,'La falta de aceite funde cojinetes en segundos.'),
 mat('Une cada función con su descripción.',[['Lubricar','Reducir fricción'],['Refrigerar','Llevarse calor'],['Limpiar','Arrastrar residuos al filtro'],['Sellar','Ayudar a sellar pistón y cilindro']],'')
]),
L('Refrigeración',
`<p>Solo una parte de la energía del combustible se convierte en trabajo. En un motor de calle, de forma aproximada, se reparte en <b>trabajo útil, calor al escape y calor al refrigerante</b>, más pérdidas por fricción.</p>
<ul><li><b>Bomba de agua</b> hace circular el refrigerante.</li><li><b>Termostato</b> mantiene la temperatura de trabajo (~90 °C).</li><li><b>Radiador</b> intercambia calor con el aire.</li><li><b>Electroventilador</b> fuerza el aire a baja velocidad.</li></ul>
<p>En competición el diseño de los <b>radiadores y conductos de aire</b> es parte de la aerodinámica: más refrigeración = más resistencia al avance.</p>`,
[
 mc('¿Qué componente regula que el motor se mantenga en su temperatura de trabajo?',['El termostato','La bomba de aceite','El turbo','El silenciador'],0,'Abre al llegar a su temperatura y deja pasar al radiador.'),
 tf('Cuanto más refrigeración necesita un auto de competición, más resistencia aerodinámica suele generar.',true,'Los conductos y radiadores frenan el aire.'),
 num('Un motor entrega 100 kW de potencia útil con un rendimiento térmico del 30 %. ¿Cuánta potencia en combustible consume?',333.3,'kW',1,'100 / 0,30 ≈ 333 kW; el resto es calor y fricción.'),
 mc('¿Dónde va la mayor parte de la energía que no se convierte en trabajo?',['Calor en gases de escape y refrigerante','Sonido','Luz','Viento'],0,'Calor.'),
 mc('Si el termostato queda trabado cerrado, el motor…',['se sobrecalienta','se enfría de más','gasta menos','no cambia'],0,'No circula refrigerante al radiador.')
]),
L('Admisión, escape y emisiones',
`<p>Más aire significa más combustible quemado y más potencia. La relación <b>aire/combustible</b> ideal de la gasolina es de unos <b>14,7 : 1</b> en masa (estequiométrica, λ = 1).</p>
<span class="k">λ = (A/F real) / (A/F estequiométrica)<br>λ &lt; 1: mezcla rica &nbsp;·&nbsp; λ &gt; 1: mezcla pobre</span>
<ul><li><b>Filtro de aire</b>, <b>mariposa</b> (regula el aire) y <b>colector</b> de admisión.</li><li><b>Sonda lambda</b>: mide oxígeno en el escape para corregir la mezcla.</li><li><b>Catalizador de tres vías</b>: convierte CO, HC y NOx en CO₂, H₂O y N₂.</li><li><b>EGR</b> recircula gases para reducir NOx; el <b>filtro de partículas</b> (DPF) atrapa hollín en diésel.</li></ul>`,
[
 num('Un motor quema 2 g/s de gasolina con mezcla estequiométrica (14,7:1). ¿Cuánto aire consume?',29.4,'g/s',0.2,'2 × 14,7 = 29,4 g/s.'),
 mc('Una mezcla con λ = 0,9 es…',['pobre','rica','estequiométrica','imposible'],1,'λ < 1 es rica: sobra combustible.'),
 mc('La sonda lambda mide…',['la temperatura del aceite','el oxígeno en los gases de escape','la presión de aceite','la velocidad'],1,'Con eso la ECU corrige la inyección.'),
 tf('El catalizador de tres vías reduce CO, hidrocarburos y óxidos de nitrógeno.',true,'Funciona mejor con mezcla cerca de λ = 1.'),
 mat('Une la pieza con su función.',[['Mariposa','Regula el aire que entra'],['Colector de admisión','Reparte el aire a los cilindros'],['EGR','Recircula gases para bajar NOx'],['DPF','Atrapa partículas del diésel']],'')
]),
L('Inyección y encendido',
`<p>La ECU decide <b>cuánto combustible</b> inyectar y <b>cuándo</b> encender la mezcla.</p>
<ul><li><b>Inyección indirecta</b>: el inyector pulveriza en el conducto de admisión.</li><li><b>Inyección directa (GDI)</b>: directo en el cilindro, a muy alta presión (cientos de bar); mejora eficiencia.</li><li><b>Common rail</b> en diésel: presiones de más de 1.000 bar.</li><li><b>Bujía y bobina</b>: chispa en el momento indicado. El <b>avance del encendido</b> se calcula para que el pico de presión ocurra poco después del punto muerto superior.</li></ul>
<div class="tip"><b>Detonación</b>Si la mezcla se enciende sola antes de tiempo (“cascabeleo”) puede perforar pistones. La ECU retrasa el avance al detectarla.</div>`,
[
 mc('¿Qué ventaja da la inyección directa?',['Mayor control y eficiencia al inyectar en el cilindro','Más peso','Menos presión','Elimina la bujía'],0,'Enfría la carga y permite más compresión.'),
 mc('El avance del encendido se ajusta para…',['que el pico de presión llegue poco después del PMS','que la bujía dure más','bajar el octanaje','enfriar el aceite'],0,'Así se aprovecha la expansión.'),
 tf('El cascabeleo (detonación) es una combustión anormal que puede dañar pistones.',true,'La ECU suele retrasar el encendido para evitarlo.'),
 mc('¿Dónde se inyecta el combustible en un sistema de inyección indirecta?',['En el cilindro','En el conducto de admisión','En el escape','En el cárter'],1,'Antes de la válvula de admisión.'),
 mat('Une cada sistema con su dato.',[['Common rail','Diésel a muy alta presión'],['GDI','Inyección directa en nafta'],['Bobina','Genera la alta tensión de la chispa'],['Sensor de detonación','Detecta cascabeleo']],'')
])
]);

U({branch:'El motor',title:'Rendimiento del motor',sub:'Turbo, distribución variable, combustibles y eficiencia.',icon:'turbo'},[
L('Sobrealimentación',
`<p>Para más potencia se mete <b>más aire</b> en el mismo cilindro. Un compresor aumenta la presión de admisión.</p>
<ul><li><b>Turbo</b>: una turbina movida por los gases de escape arrastra un compresor. Aprovecha energía que se perdería, pero tiene retardo (<i>lag</i>).</li><li><b>Compresor mecánico (supercharger)</b>: lo mueve el cigüeñal por correa; respuesta inmediata, pero consume potencia.</li><li><b>Intercooler</b>: enfría el aire comprimido para que sea más denso.</li><li><b>Wastegate</b>: válvula que limita la presión de sobrealimentación.</li></ul>
<span class="k">Relación de presión = P absoluta de salida / P de entrada</span>`,
[
 num('Un turbo da 1,0 bar de sobrepresión sobre la atmosférica (≈1,0 bar). ¿Cuál es la relación de presión aproximada?',2,':1',0.1,'Presión absoluta ≈ 2 bar sobre 1 bar de entrada.'),
 mc('¿Para qué sirve el intercooler?',['Para enfriar el aire comprimido','Para calentar el aceite','Para filtrar el aire','Para frenar'],0,'Aire más frío es más denso, entra más oxígeno y baja el riesgo de detonar.'),
 mc('Un turbo se mueve gracias a…',['la correa de accesorios','los gases de escape','el motor eléctrico del arranque','la bomba de aceite'],1,'Una turbina en el escape.'),
 tf('El “turbo lag” es el retardo hasta que el turbo alcanza la presión de trabajo.',true,'Hay menos gas de escape a bajas rpm.'),
 mat('Une cada elemento con su función.',[['Wastegate','Limita la presión de sobrealimentación'],['Compresor mecánico','Lo mueve el cigüeñal'],['Turbo','Usa la energía del escape'],['Intercooler','Baja la temperatura de admisión']],'')
]),
L('Distribución variable y régimen',
`<p>Un perfil de levas fijo es un compromiso: bueno a bajas o a altas rpm, no a todas. La <b>distribución variable (VVT)</b> modifica en marcha el momento y a veces la altura de apertura de las válvulas, ampliando la zona útil del motor.</p>
<ul><li>A bajas rpm interesa poco cruce y apertura corta: buen par y consumo.</li><li>A altas rpm interesa abrir más y más tiempo: mucha potencia.</li></ul>
<p>El límite de rpm lo marca, entre otros, la <b>velocidad media del pistón</b>:</p>
<span class="k">v_pistón = 2 · S · n / 60 &nbsp;(S en m, n en rpm)</span>`,
[
 num('Un motor con 80 mm de carrera gira a 7.500 rpm. ¿Cuál es la velocidad media del pistón?',20,'m/s',0.1,'2 × 0,08 × 7.500 / 60 = 20 m/s.'),
 mc('La distribución variable busca…',['un solo perfil perfecto para todas las rpm','adaptar la apertura de válvulas al régimen','eliminar el árbol de levas','aumentar la cilindrada'],1,'Ensancha la zona útil de par.'),
 tf('Una carrera más corta permite alcanzar más rpm con la misma velocidad media del pistón.',true,'v = 2·S·n.'),
 mc('Si baja la carrera, manteniendo rpm, la velocidad media del pistón…',['aumenta','disminuye','queda igual','se anula'],1,'Es proporcional a S.'),
 mc('A altas rpm, para mejorar el llenado se suele…',['abrir las válvulas antes y por más tiempo','cerrar la mariposa','bajar la presión del aceite','reducir el escape'],0,'Aprovecha la inercia del aire.')
]),
L('Combustibles y octanaje',
`<p>El <b>octanaje (RON)</b> mide la resistencia de la nafta a detonar. Un motor de más compresión o con más turbo necesita más octanos.</p>
<ul><li>95 y 98 RON en estaciones; el etanol (E85) tiene octanaje alto y enfría la carga, pero tiene menos energía por litro.</li><li>El <b>diésel</b> se mide por <b>cetano</b>: cuanto más alto, mejor autoencendido.</li><li>En competición, los combustibles se regulan; la F1 usa en 2026 <b>combustibles 100 % sostenibles</b> de tipo “drop-in”.</li></ul>
<div class="tip"><b>Energía por litro</b>La nafta tiene más energía por litro que el etanol; por eso un auto con E85 gasta más litros.</div>`,
[
 mc('¿Qué mide el octanaje?',['La resistencia a la detonación','La energía por litro','La densidad','La temperatura de ignición'],0,'RON: octane rating.'),
 tf('El etanol tiene más energía por litro que la gasolina.',false,'Tiene menos energía por litro, pero mayor octanaje.'),
 mc('Un combustible “drop-in” es aquel que…',['se puede usar sin modificar el motor','solo sirve con motores eléctricos','no contiene carbono','es solo para diésel'],0,'Se vierte en el tanque de motores existentes.'),
 mc('Para un motor turbo de alta presión conviene…',['un combustible de mayor octanaje','uno de menor octanaje','agua','gasoil'],0,'Para resistir la detonación.'),
 mc('En diésel se habla de…',['octanos','cetanos','litros','newton'],1,'Cetano mide la facilidad de autoencendido.')
]),
L('Eficiencia y rendimiento térmico',
`<p>El <b>rendimiento térmico</b> es la fracción de la energía del combustible que se convierte en trabajo en el cigüeñal.</p>
<span class="k">η = P útil / P del combustible</span>
<ul><li>Motores de calle: del orden de 25–35 %.</li><li>Diésel grandes y motores de competición muy optimizados superan eso; los fabricantes de F1 informan más de 50 % en banco desde la era turbohíbrida.</li><li><b>Consumo específico (BSFC)</b>: gramos de combustible por kWh producido.</li></ul>
<p>Más relación de compresión, mezcla pobre, menos fricción, recuperación de energía y combustión rápida suben la eficiencia.</p>`,
[
 num('Un motor entrega 90 kW y su rendimiento térmico es 30 %. ¿Qué potencia contiene el combustible que consume?',300,'kW',1,'90 / 0,30 = 300 kW.'),
 mc('El BSFC mide…',['gramos de combustible por kWh','kilómetros por litro','presión de inyección','rpm máximas'],0,'Consumo específico al freno.'),
 tf('Reducir la fricción interna mejora la eficiencia del motor.',true,'Menos pérdidas mecánicas.'),
 mc('¿Qué pasa con la energía del combustible que no se convierte en trabajo?',['Se pierde como calor y fricción','Se almacena en el aceite','Vuelve al tanque','Se convierte en octanos'],0,'Gases calientes y refrigeración.'),
 mc('Un motor con 35 % de rendimiento a 100 kW de combustible entrega aproximadamente…',['3,5 kW','35 kW','65 kW','100 kW'],1,'0,35 × 100.')
])
]);

U({branch:'Chasis y dinámica',title:'Transmisión y tracción',sub:'Del cigüeñal a la rueda: embrague, caja, diferencial y tracción.',icon:'shaft'},[
L('Embrague y caja manual',
`<p>La transmisión adapta el giro del motor a la velocidad y la fuerza que necesitan las ruedas.</p>
<ul><li><b>Embrague</b>: un disco de fricción entre el volante del motor y la caja; permite desacoplar para arrancar y cambiar.</li><li><b>Caja de cambios</b>: varios pares de engranajes. Una marcha corta da mucho par y poca velocidad; una larga, lo contrario.</li><li><b>Sincronizadores</b>: igualan velocidades para que los engranajes entren sin rascar.</li><li><b>Relación final</b> (corona/piñón del diferencial): una última multiplicación.</li></ul>
<span class="k">relación total = relación de marcha × relación final<br>rpm rueda = rpm motor / relación total<br>v = rpm rueda × 2π · r / 60</span>`,
[
 num('Un motor gira a 3.000 rpm, la relación total es 3,0 y el radio de la rueda es 0,30 m. ¿A qué velocidad va el auto (km/h)?',113.1,'km/h',1.5,'rpm rueda = 1.000; v = 1.000 × 2π × 0,3 / 60 = 31,4 m/s ≈ 113 km/h.'),
 mc('Una primera marcha “corta” entrega…',['más par en la rueda y menos velocidad','menos par y más velocidad','igual par','no cambia'],0,'Relación numéricamente alta.'),
 tf('El embrague permite desacoplar momentáneamente el motor de la caja.',true,'Así se arranca sin calar y se cambia de marcha.'),
 mat('Une cada componente con su función.',[['Sincronizador','Iguala velocidades al cambiar'],['Disco de embrague','Transmite por fricción'],['Relación final','Última multiplicación antes de la rueda'],['Volante de inercia','Suaviza los pulsos del motor']],''),
 mc('Una relación total más alta (numéricamente) con el mismo motor da…',['más aceleración y menos velocidad máxima a las mismas rpm','menos aceleración','igual velocidad','más consumo siempre'],0,'Más multiplicación de par.')
]),
L('Automáticas, DCT y secuenciales',
`<p>Hay varias formas de cambiar de marcha sin que el conductor haga todo a mano.</p>
<ul><li><b>Automática con convertidor de par</b>: engranajes planetarios; suave y robusta.</li><li><b>CVT</b>: relación continuamente variable con correa o cadena y poleas.</li><li><b>DCT (doble embrague)</b>: dos embragues, uno para marchas pares y otro para impares; la siguiente marcha ya está engranada y el cambio dura milisegundos.</li><li><b>Caja secuencial</b> de competición: se cambia con levas o palanca, en orden, con engranajes de garras (<i>dog rings</i>) y cambios muy rápidos, a veces sin levantar el acelerador.</li></ul>`,
[
 mc('¿Qué caja tiene dos embragues, uno para pares y otro para impares?',['CVT','DCT','Manual','Planetaria'],1,'Dual Clutch Transmission.'),
 mc('Una caja CVT se caracteriza por…',['tener infinitas relaciones dentro de un rango','tener solo 2 marchas','usar un solo engranaje','no tener embrague ni nada'],0,'Cambia de relación de forma continua.'),
 tf('Las cajas secuenciales de competición usan habitualmente engranajes de garras para cambiar muy rápido.',true,'Los dog rings permiten cambios casi instantáneos.'),
 tf('En una caja secuencial las marchas se engranan siempre en orden, una tras otra.',true,'Se puede bajar varias seguidas, pero el mecanismo pasa por cada una.'),
 mc('La ventaja de un DCT frente a una manual en aceleración es…',['cambios más rápidos y constantes','menos peso','menor costo','no tiene engranajes'],0,'Casi sin interrupción de par.')
]),
L('Diferencial y reparto de par',
`<p>En una curva la rueda exterior recorre más distancia que la interior, así que deben girar a velocidades distintas. De eso se encarga el <b>diferencial</b>.</p>
<ul><li><b>Abierto</b>: reparte el par igual entre ambas ruedas. Si una patina, la otra se queda sin fuerza.</li><li><b>Autoblocante (LSD)</b>: limita la diferencia de velocidad entre ruedas (discos, Torsen, viscoso) y mejora la tracción al salir de una curva.</li><li><b>Diferencial central</b> (o acople) reparte entre ejes en un 4×4.</li><li>En competición se regulan la <b>precarga</b> y las rampas del LSD: cambian la entrada, el apex y la salida de curva.</li></ul>`,
[
 tf('En una curva la rueda exterior gira más rápido que la interior.',true,'Recorre una circunferencia mayor.'),
 mc('Con un diferencial abierto, si una rueda motriz pierde agarre…',['la otra recibe más par','la otra recibe un par similar, muy bajo','el auto acelera mejor','se bloquea el eje'],1,'El par se reparte igual y queda limitado por la rueda que patina.'),
 mc('Un autoblocante (LSD) sirve para…',['mejorar la tracción limitando la diferencia entre ruedas','desactivar los frenos','subir la presión de los neumáticos','mejorar el sonido'],0,'Reparte par a la rueda con agarre.'),
 mat('Une el tipo de diferencial con su rasgo.',[['Abierto','Reparte par igual'],['LSD','Limita la diferencia de giro'],['Central','Reparte entre eje delantero y trasero'],['Bloqueo total','Fuerza ambas ruedas a girar igual']],''),
 mc('Un diferencial muy bloqueado, en curva cerrada a baja velocidad, suele…',['dar subviraje o hacer “arrastrar” el auto','dar más facilidad de giro','no cambiar','soltar el eje'],0,'Obliga a las ruedas a girar igual, que no es lo ideal en curva.')
]),
L('Tracción delantera, trasera y total',
`<p>¿A qué ruedas llega la potencia?</p>
<ul><li><b>FWD (delantera)</b>: compacta y económica; el eje delantero hace dirigir y traccionar a la vez.</li><li><b>RWD (trasera)</b>: la aceleración transfiere peso atrás y mejora el agarre; es la base de los autos deportivos y de carreras.</li><li><b>AWD / 4×4</b>: reparte par en los cuatro; mejor salida de curva y bajo agarre.</li></ul>
<p>El <b>motor central</b> (delante del eje trasero) concentra la masa cerca del centro del auto; es lo habitual en F1, Hypercar y muchos GT3. En el WEC algunos Hypercar híbridos usan un motor eléctrico en el eje delantero que entra en acción solo por encima de cierta velocidad (unos 190 km/h en seco), creando una tracción total temporal.</p>`,
[
 mc('Al acelerar fuerte, la carga vertical se transfiere hacia…',['el eje delantero','el eje trasero','los costados','ninguno'],1,'Por eso la tracción trasera es favorable en aceleración.'),
 mat('Une cada tracción con su descripción.',[['FWD','Potencia a las ruedas delanteras'],['RWD','Potencia a las ruedas traseras'],['AWD','Potencia a los dos ejes'],['Motor central','Motor delante del eje trasero']],''),
 tf('La mayoría de los autos de F1 tienen el motor entre el piloto y el eje trasero.',true,'Disposición de motor central.'),
 mc('¿Qué ventaja da el motor central?',['Masa concentrada cerca del centro del coche y buen reparto de peso','Más espacio de baúl','Menos costo','Menos peso total'],0,'Facilita la agilidad y el equilibrio.'),
 mc('En condiciones de mucha lluvia, un sistema AWD suele…',['mejorar la tracción disponible','empeorar siempre','impedir frenar','no influir'],0,'Reparte la tracción en cuatro ruedas.')
])
]);

U({branch:'Chasis y dinámica',title:'Suspensión y dirección',sub:'Cómo el auto sostiene sus ruedas y las orienta.',icon:'spring'},[
L('Resortes y masa suspendida',
`<p>La suspensión mantiene el neumático en contacto con el suelo y aísla al chasis de las irregularidades.</p>
<ul><li><b>Masa suspendida</b>: chasis, motor, ocupantes. <b>Masa no suspendida</b>: ruedas, frenos, parte de la suspensión. Conviene que la no suspendida sea lo más baja posible.</li><li><b>Resorte</b>: almacena energía. Su rigidez es <b>k = F / x</b> (N/mm).</li><li>Un resorte más duro reduce el balanceo pero transmite más golpes.</li></ul>

 mc('¿Por qué se usa pushrod o pullrod en un F1?',['Para ubicar resortes y amortiguadores dentro del chasis y mejorar la aerodinámica','Porque es más barato','Porque pesa más','Porque no necesita amortiguador'],0,'Libera el flujo de aire alrededor de la rueda y permite packaging.'),

]),
L('Geometría: camber, caster y convergencia',

]),
L('Amortiguadores y barras estabilizadoras',

 mc('Un amortiguador de “4 vías” permite regular…',['la compresión y el rebote en baja y alta velocidad','solo la altura','la presión de aceite','la dureza del resorte únicamente'],0,'Cuatro ajustes independientes.'),
 mc('La barra estabilizadora actúa principalmente cuando…',['el auto se inclina en curva','el auto va recto','se frena a fondo','está detenido'],0,'Resiste el balanceo diferencial entre las ruedas.'),
 mc('Un auto sin amortiguadores…',['rebotaría varias veces tras un bache','sería más cómodo','frenaría mejor','pesaría más'],0,'El resorte oscilaría libremente.')
]),
L('Dirección',
`<p>La dirección orienta las ruedas delanteras (y en algunos autos, también las traseras).</p>
<ul><li><b>Cremallera y piñón</b>: es el sistema más común; el volante gira un piñón que desplaza la cremallera.</li><li><b>Relación de dirección</b>: cuántos grados de volante equivalen a un giro de las ruedas. Una relación más rápida responde más rápido.</li><li><b>Asistencia</b>: hidráulica o eléctrica (EPS) para aliviar el esfuerzo.</li><li><b>Ackermann</b>: la rueda interior gira más que la exterior en curva porque describe un círculo más cerrado.</li></ul>`,
[
 mc('En una curva, la rueda delantera interior debe girar…',['igual que la exterior','más que la exterior (geometría Ackermann)','menos que la exterior','no girar'],1,'Porque su radio de giro es menor.'),
 tf('La dirección de cremallera es la más usada en autos actuales.',true,'Es simple y precisa.'),
 mc('Una relación de dirección “rápida” significa…',['menos vueltas de volante de tope a tope','más vueltas','sin asistencia','solo trasera'],0,'Con poco giro se orientan mucho las ruedas.'),
 mc('La asistencia eléctrica (EPS) permite…',['ajustar el esfuerzo según velocidad y contexto','eliminar el volante','aumentar el peso','frenar'],0,'La ECU modula la ayuda.'),
 mat('Une cada término con su función.',[['Cremallera','Convierte el giro en movimiento lineal'],['Ackermann','Ángulos distintos en las ruedas al girar'],['EPS','Asistencia eléctrica'],['Barra de acople','Une la cremallera con la rueda']],'')
])
]);

U({branch:'Chasis y dinámica',title:'Frenos y neumáticos',sub:'Convertir energía en calor y fuerza en agarre.',icon:'disc'},[
L('El sistema de frenos',
`<p>Frenar es convertir energía cinética en <b>calor</b> por fricción. El pedal acciona un circuito <b>hidráulico</b>.</p>
<span class="k">Presión: P = F / A<br>En un circuito cerrado la presión es la misma en todo el fluido.</span>
<ul><li>Pedal → <b>cilindro maestro</b> → líneas → <b>pistones de pinza</b> → pastillas contra el disco.</li><li>Un pistón mayor en la pinza <b>multiplica la fuerza</b>.</li><li>Discos <b>ventilados</b> disipan mejor el calor. En F1 se usan discos de carbono-carbono que trabajan a temperaturas muy altas (cientos de grados hasta más de 1.000 °C).</li></ul>`,
[
 num('El cilindro maestro tiene 2 cm² de área y recibe 200 N. ¿Qué presión genera? (1 bar = 100.000 Pa)',10,'bar',0.1,'P = 200 / 0,0002 = 1.000.000 Pa = 10 bar.'),
 num('Esa misma presión actúa sobre un pistón de pinza de 20 cm². ¿Qué fuerza genera? (presión 10 bar)',2000,'N',20,'F = 1.000.000 Pa × 0,002 m² = 2.000 N.'),
 mc('Al frenar, la energía cinética del auto se transforma principalmente en…',['calor','luz','combustible','sonido'],0,'Calor en discos y pastillas.'),
 tf('Los discos ventilados ayudan a disipar calor.',true,'Tienen canales internos por donde circula aire.'),
 mc('¿Qué ley explica que la presión se transmite igual en un circuito hidráulico cerrado?',['Ley de Pascal','Ley de Hooke','Ley de Ohm','Ley de Boyle'],0,'Pascal.')
]),
L('ABS, reparto y fading',
`<ul><li><b>ABS</b>: evita el bloqueo de ruedas modulando la presión muchas veces por segundo; así el neumático conserva fuerza lateral y se puede esquivar mientras se frena.</li><li><b>Reparto de frenada (<i>brake bias</i>)</b>: al frenar la carga se va al eje delantero, entonces ese eje debe aportar más frenada (por ejemplo, 55–70 % según el auto). En competición se regula desde el volante.</li><li><b>Fading</b>: pérdida de eficacia por exceso de temperatura, ya sea porque se degrada la fricción de las pastillas o porque el líquido hierve.</li><li>El <b>líquido de frenos</b> absorbe humedad con el tiempo y baja su punto de ebullición; hay que cambiarlo.</li></ul>`,
[
 mc('¿Por qué un auto frena más con el eje delantero?',['Por la transferencia de carga hacia adelante al frenar','Por el color de los discos','Por el motor','Por el viento'],0,'El peso se va hacia adelante y ese eje tiene más agarre.'),
 mc('¿Qué evita el ABS?',['El bloqueo de las ruedas','El sobrecalentamiento del motor','El consumo excesivo','El cabeceo'],0,'Mantiene el giro de las ruedas para conservar control.'),
 tf('El líquido de frenos puede absorber humedad y volverse menos eficaz con el tiempo.',true,'Su punto de ebullición baja.'),
 mc('Si el pedal se siente “esponjoso” tras una bajada larga muy exigente, probablemente hay…',['fading o vapor en el circuito','exceso de neumáticos','poca nafta','demasiado aceite'],0,'El líquido pudo hervir.'),
 mat('Une cada término con su descripción.',[['ABS','Evita el bloqueo de las ruedas'],['Brake bias','Reparto de frenada delante/atrás'],['Fading','Pérdida de eficacia por calor'],['Líquido DOT','Fluido hidráulico del circuito']],'')
]),
L('El neumático',
`<p>Es el único contacto entre el auto y el suelo: cada neumático tiene un parche de contacto del tamaño de una mano.</p>
<span class="k">225 / 45 R17<br>225 = ancho (mm) · 45 = perfil (% del ancho) · R = radial · 17 = llanta (pulgadas)</span>
<ul><li><b>Compuesto</b>: más blando = más agarre y menos durabilidad.</li><li><b>Presión y temperatura</b>: cada neumático tiene una ventana de trabajo. Demasiado frío no agarra; demasiado caliente se degrada.</li><li><b>Slicks</b> sin dibujo para seco; neumáticos de lluvia con canales para evacuar agua.</li></ul>`,
[
 num('En un neumático 225/45 R17, ¿cuál es la altura del flanco en mm? (perfil = 45 % del ancho)',101.25,'mm',0.5,'0,45 × 225 = 101,25 mm.'),
 num('¿Cuál es el diámetro total en mm de un 225/45 R17? (1 pulgada = 25,4 mm; llanta + 2 flancos)',634.3,'mm',2,'17 × 25,4 + 2 × 101,25 ≈ 634 mm.'),
 mc('Un compuesto más blando suele dar…',['más agarre y menos durabilidad','menos agarre y más durabilidad','igual','solo más ruido'],0,'Es el compromiso típico.'),
 tf('Un neumático demasiado frío o demasiado caliente pierde agarre.',true,'Existe una ventana óptima de temperatura.'),
 mc('Los slicks se usan en…',['pista seca','lluvia fuerte','barro','nieve'],0,'Sin dibujo, máxima superficie de contacto.')
]),
L('Agarre y deslizamiento',
`<p>Para frenar, girar o acelerar, el neumático debe <b>deslizar un poco</b>. Ese deslizamiento genera fuerza.</p>
${figSlip()}
<ul><li><b>Ángulo de deriva (α)</b>: diferencia entre hacia dónde apunta el neumático y hacia dónde va. Genera fuerza lateral hasta un máximo (algunos grados) y después cae.</li><li><b>Deslizamiento longitudinal</b>: en frenada o aceleración la fuerza máxima se da con unos pocos por ciento de deslizamiento.</li></ul>
${figFriction()}
<p>El <b>círculo de fricción</b> resume que la fuerza total (frenar + girar + acelerar) tiene un límite. Si usas todo el agarre para frenar, no queda para girar: por eso se frena en recta y se suelta el freno progresivamente al entrar a la curva.</p>`,
[
 mc('El ángulo de deriva es…',['la diferencia entre hacia dónde apunta el neumático y su trayectoria','la inclinación vertical','la presión','el diámetro'],0,'Genera la fuerza lateral.'),
 tf('Con el neumático al límite de la frenada, queda mucho agarre lateral disponible.',false,'Casi no queda: la fuerza total es limitada (círculo de fricción).'),
 mc('Al bloquear una rueda, el deslizamiento es…',['100 % y baja la fuerza de frenado','cero','óptimo','independiente del agarre'],0,'Pasó el pico de agarre.'),
 mc('Para aprovechar el agarre en una curva, el piloto…',['frena fuerte y suelta de forma gradual al entrar','frena a fondo al apex','acelera al máximo antes de girar','suelta el volante'],0,'Es la técnica de trail braking.'),
 mat('Une cada concepto con su idea.',[['Slip angle','Genera fuerza lateral'],['Slip ratio','Deslizamiento en frenada/aceleración'],['Círculo de fricción','Límite de fuerza total'],['Bloqueo','Deslizamiento total de la rueda']],'')
])
]);

U({branch:'Chasis y dinámica',title:'Dinámica vehicular',sub:'Cómo se mueve el auto en curva, frenada y aceleración.',icon:'curve'},[
L('Transferencia de carga',
`<p>Cuando el auto acelera, frena o gira, el peso total no cambia, pero <b>se reparte distinto</b> entre las ruedas. Eso es la transferencia de carga.</p>
<span class="k">Longitudinal: ΔW = m · a · h / L<br>Lateral: ΔW = m · a_y · h / t<br>h = altura del CG · L = distancia entre ejes · t = ancho de vía</span>
<p>Cuanto <b>más alto</b> el centro de gravedad y <b>más corto</b> el batalla (o la vía), mayor la transferencia. Más transferencia significa que las ruedas descargadas pierden agarre más rápido que lo que ganan las cargadas, así que el auto en total agarra peor.</p>`,
[
 num('Un auto de 1.200 kg frena con 8 m/s². Su CG está a 0,5 m de altura y la distancia entre ejes es 2,6 m. ¿Cuántos newton se transfieren al eje delantero?',1846,'N',10,'ΔW = 1.200 × 8 × 0,5 / 2,6 ≈ 1.846 N.'),
 mc('Bajar el centro de gravedad produce…',['menos transferencia de carga','más transferencia','más masa','mayor cilindrada'],0,'ΔW es proporcional a h.'),
 tf('En frenada se descarga el eje trasero.',true,'La carga se transfiere al eje delantero.'),
 mc('Un auto más ancho de vía, a igual CG, tiene en curva…',['menos transferencia lateral','más transferencia lateral','igual','cero agarre'],0,'ΔW es inversamente proporcional a t.'),
 mc('¿Por qué importa la transferencia de carga?',['Porque el agarre del neumático no crece linealmente con la carga','Porque cambia el color del auto','Porque aumenta el octanaje','Porque cambia el volumen'],0,'El neumático ofrece rendimiento decreciente por carga extra.')
]),
L('Subviraje y sobreviraje',
`<p>El <b>balance</b> describe qué eje pierde agarre primero:</p>
<ul><li><b>Subviraje</b> (<i>understeer</i>): el eje delantero se agota primero; el auto “se abre” y no gira lo que pides.</li><li><b>Sobreviraje</b> (<i>oversteer</i>): el eje trasero se agota primero; la cola “se va”.</li><li><b>Neutro</b>: ambos ejes llegan al límite casi juntos.</li></ul>
<ul><li>Para <b>corregir subviraje</b>: aflojar la barra estabilizadora delantera o endurecer la trasera, o dar más ángulo al ala delantera.</li><li>Para <b>corregir sobreviraje</b>: lo contrario; además, en recuperación, mirar y dirigir hacia donde se quiere ir y dosificar el acelerador.</li></ul>`,
[
 mc('Si en una curva el auto sigue recto aunque giras más el volante, hay…',['subviraje','sobreviraje','neutral','aquaplaning'],0,'Se agotó el agarre delantero.'),
 mc('Cuando la cola del auto se desliza hacia afuera, hay…',['sobreviraje','subviraje','agarre perfecto','aquaplaning'],0,'El eje trasero perdió agarre primero.'),
 tf('Una barra estabilizadora trasera más rígida tiende a aumentar el sobreviraje.',true,'Lleva más transferencia de carga al eje trasero.'),
 mat('Une cada situación con su descripción.',[['Subviraje','Se agota el eje delantero'],['Sobreviraje','Se agota el eje trasero'],['Neutro','Ambos ejes llegan juntos al límite'],['Aquaplaning','Pérdida de contacto por capa de agua']],''),
 mc('Una forma habitual de reducir el subviraje con ala ajustable es…',['aumentar el ángulo del ala delantera','sacar el ala trasera','bajar la presión trasera siempre','cambiar la nafta'],0,'Más carga delantera, más agarre del eje delantero.')
]),
L('Curvas y límites de velocidad',
`<p>En una curva de radio <b>r</b> a velocidad <b>v</b>, la aceleración lateral es:</p>
<span class="k">a_y = v² / r<br>Velocidad máxima: v = √(μ · g · r)<br>En “g”: a_y / 9,81</span>
<p>El límite lo marca el agarre: μ·g es la aceleración lateral máxima sin aerodinámica. Con <b>carga aerodinámica</b> el agarre aumenta con la velocidad, así que un F1 puede tomar curvas rápidas a más de 4 g laterales, algo imposible para un auto de calle.</p>
<p>El <b>peralte</b> (banking) inclina la pista para que el peso ayude a girar.</p>`,
[
 num('Un auto toma una curva de 100 m de radio a 100 km/h (27,78 m/s). ¿Cuál es su aceleración lateral en m/s²?',7.7,'m/s²',0.1,'a = 27,78² / 100 ≈ 7,7 m/s².'),
 num('¿Cuál es la velocidad máxima en una curva de 50 m con μ = 1,2 (sin aero) en km/h? (g = 9,81)',87.3,'km/h',1,'v = √(1,2 × 9,81 × 50) ≈ 24,3 m/s ≈ 87 km/h.'),
 mc('Al duplicar la velocidad en una curva de igual radio, la aceleración lateral necesaria…',['se duplica','se cuadruplica','queda igual','se reduce'],1,'a = v²/r.'),
 tf('La carga aerodinámica permite tomar curvas más rápido porque aumenta el agarre con la velocidad.',true,'Más fuerza normal, más fuerza lateral máxima.'),
 mc('Un peralte positivo en una curva…',['ayuda a girar y aumenta la velocidad posible','empeora el agarre','no cambia','solo sirve para frenar'],0,'La componente del peso ayuda a la fuerza centrípeta.')
])
]);
